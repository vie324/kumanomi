                        {/* 手順 */}
                        <div className="mt-5 card p-4">
                            <div className="font-black text-[13px] mb-2.5">やりかた</div>
                            <ol className="space-y-2.5">
                                {s.steps.map((st, i) => (
                                    <li key={i} className="flex gap-2.5 items-start">
                                        <span className="w-5.5 h-5.5 min-w-[22px] h-[22px] rounded-full bg-night text-cream text-[11px] font-black flex items-center justify-center">{i + 1}</span>
                                        <span className="text-[12.5px] font-bold text-[#4A453C] leading-relaxed">{st}</span>
                                    </li>
                                ))}
                            </ol>
                        </div>
                        <div className="mt-3 p-4 rounded-2xl bg-lav-pale">
                            <div className="text-[11.5px] font-black text-lav-deep mb-1">⚖️ 自律神経へのはたらき</div>
                            <p className="text-[12px] font-bold text-[#5A5470] leading-relaxed">{s.effect}</p>
                        </div>
                        <div className="mt-2 text-[10px] font-bold text-[#B9B2A6] text-center">痛みが出る場合は中止して、次回来店時にスタッフへご相談ください</div>
                    </div>
                </Sheet>
            );
        };

        // ============================================================
        // ショップ(EC + サブスク)
        // ============================================================
        const cartCount = (cart) => Object.values(cart).reduce((a, b) => a + b, 0);

        const ShopView = () => {
            const { state, update } = useApp();
            const { openSheet } = useUI();
            const [cat, setCat] = useState('すべて');
            const cats = ['すべて', ...Array.from(new Set(PRODUCTS.map(p => p.cat)))];
            const type = state.diagFull ? DIAG_TYPES[state.diagFull.typeKey] : null;
            const list = PRODUCTS.filter(p => cat === 'すべて' || p.cat === cat)
                .slice().sort((a, b) => {
                    const ra = type && type.products.includes(a.id) ? 0 : 1;
                    const rb = type && type.products.includes(b.id) ? 0 : 1;
                    return ra - rb;
                });
            const n = cartCount(state.cart);

            return (
                <div className="pb-40">
                    <div className="relative overflow-hidden" style={{ background: 'linear-gradient(175deg,#0C1526,#182642)' }}>
                        <StarrySky density={16} shooting={false} />
                        <div className="relative max-w-lg mx-auto px-5 pt-6 pb-5">
                            <div className="text-cream font-black text-lg">SLEEPY ストア</div>
                            <div className="text-cream/55 text-[11px] font-bold mt-0.5">在庫なし・持ち帰り不要。ご自宅にお届けします</div>
                        </div>
                        <svg viewBox="0 0 400 18" className="block w-full" preserveAspectRatio="none" style={{ height: 18 }}><path d="M0,18 L0,8 Q100,-6 200,8 T400,8 L400,18 Z" fill="#F4F1EA" /></svg>
                    </div>

                    <div className="max-w-lg mx-auto px-4 mt-3 space-y-4">
                        {/* 店頭QR案内(ステップ12) */}
                        <div className="card p-4 flex items-center gap-3.5 anim-fade-up" style={{ background: '#FFF6E3', border: '1px solid rgba(246,206,110,.5)' }}>
                            <div className="w-12 h-12 rounded-xl bg-white flex items-center justify-center flex-shrink-0 border border-moon/40">
                                <svg width="26" height="26" viewBox="0 0 24 24" fill="#7A5238"><path d="M3,3h8v8H3V3z M5,5v4h4V5H5z M13,3h8v8h-8V3z M15,5v4h4V5H15z M3,13h8v8H3V13z M5,15v4h4v-4H5z M13,13h3v3h-3V13z M18,13h3v3h-3V13z M13,18h3v3h-3V18z M18,18h3v3h-3V18z"/></svg>
                            </div>
                            <div className="text-[11px] font-bold text-[#8B6B3A] leading-relaxed">店頭のショーケースで実物を体験したら、<span className="font-black">QRからこのECでその場で購入</span>(来店ステップ10〜12)。重い荷物なしでご自宅にお届けします。</div>
                        </div>

                        {type && (
                            <div className="flex items-center gap-2 px-1 text-[11px] font-black text-lav-deep">
                                <span>{type.emoji}</span>「{type.name}」のあなたへのおすすめを先頭に表示中
                            </div>
                        )}

                        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                            {cats.map(c => (
                                <button key={c} onClick={() => setCat(c)} className={`btn-press flex-shrink-0 px-3.5 py-1.5 rounded-full text-[11.5px] font-black border transition ${cat === c ? 'bg-night text-cream border-night' : 'bg-white text-[#8B857A] border-[#E7E1D4]'}`}>{c}</button>
                            ))}
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            {list.map((p, i) => {
                                const rec = type && type.products.includes(p.id);
                                return (
                                    <button key={p.id} onClick={() => openSheet('product', p.id)} className="btn-press card p-3.5 text-left anim-fade-up relative overflow-hidden" style={{ animationDelay: (i * 25) + 'ms' }}>
                                        {rec && <div className="absolute top-0 right-0 px-2 py-0.5 rounded-bl-xl bg-lav text-white text-[8.5px] font-black">AIおすすめ</div>}
                                        <div className="w-full aspect-square rounded-2xl bg-[#FAF7F0] border border-[#EFEAE0] flex items-center justify-center text-[44px] mb-2">{p.icon}</div>
                                        <div className="text-[9.5px] font-black text-[#B9B2A6]">{p.cat}</div>
                                        <div className="font-black text-[12px] leading-snug mt-0.5 min-h-[32px]">{p.name}</div>
                                        <div className="font-black text-[14px] text-night mt-1">{yen(p.price)}</div>
                                    </button>
                                );
                            })}
                        </div>

                        {/* サブスク */}
                        <div id="subsc-anchor" className="pt-2">
                            <div className="font-black text-[14px] px-1 mb-1">プラン・サブスク 📅</div>
                            <div className="text-[11px] font-bold text-[#8B857A] px-1 mb-3">通うほどおトクに。施術と商品お届けがセットの定期プランです(来店ステップ11)</div>
                            <div className="space-y-3">
                                {SUBSC_PLANS.map(pl => {
                                    const joined = state.subscription && state.subscription.planId === pl.id;
                                    return (
                                        <div key={pl.id} className={`card p-4 relative overflow-hidden anim-fade-up ${pl.popular ? 'border-2 border-lav' : ''}`}>
                                            {pl.popular && <div className="absolute top-0 right-0 px-2.5 py-1 rounded-bl-2xl bg-lav text-white text-[9px] font-black">いちばん人気</div>}
                                            <div className="flex items-end justify-between">
                                                <div>
                                                    <div className="font-black text-[14.5px]">{pl.name}</div>
                                                    <div className="text-[10.5px] font-bold text-[#8B857A] mt-0.5">{pl.for}</div>
                                                </div>
                                                <div className="text-right flex-shrink-0 pl-2">
                                                    <span className="font-black text-[19px] text-night">{yen(pl.price)}</span>
                                                    <span className="text-[10px] font-bold text-[#B9B2A6]">/{pl.per}</span>
                                                </div>
                                            </div>
                                            <div className="mt-2.5 flex items-center gap-1.5 text-[11.5px] font-black text-lav-deep"><span>🤲</span>{pl.visits}</div>
                                            <ul className="mt-1.5 space-y-1">
                                                {pl.items.map((it, i) => <li key={i} className="flex gap-1.5 text-[11px] font-bold text-[#6B655B]"><span className="text-mint">✓</span>{it}</li>)}
                                            </ul>
                                            <button onClick={() => {
                                                hapticTap();
                                                if (joined) { update(s => { s.subscription = null; return s; }); showToast('プランを解約しました', 'info'); }
                                                else { update(s => { s.subscription = { planId: pl.id, since: todayYMD() }; return s; }); hapticYay(); showToast(`${pl.name}に加入しました🎉`, 'success'); }
                                            }} className={`btn-press w-full mt-3 py-2.5 rounded-xl font-black text-[12.5px] ${joined ? 'bg-[#EFEAE0] text-[#8B857A]' : 'bg-night text-cream'}`}>
                                                {joined ? '加入中(タップで解約)' : 'このプランに加入する'}
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                        <div className="text-[10px] font-bold text-[#B9B2A6] text-center leading-relaxed pb-2">※デモアプリのため、実際の決済は行われません</div>
                    </div>

                    {/* カートFAB */}
                    <button onClick={() => openSheet('cart')} className="btn-press fixed bottom-24 right-4 z-40 w-14 h-14 rounded-full shadow-xl flex items-center justify-center" style={{ background: 'linear-gradient(135deg,#22335A,#101A2E)' }} aria-label="カート">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFF8EC" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1.6"/><circle cx="19" cy="21" r="1.6"/><path d="M2.5 3h2l2.7 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21.5 7H6"/></svg>
                        {n > 0 && <span className="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-moon text-night text-[11px] font-black flex items-center justify-center border-2 border-[#F4F1EA]">{n}</span>}
                    </button>
                </div>
            );
        };

        // 商品詳細シート
        const ProductSheet = ({ productId, onClose }) => {
            const { state, update } = useApp();
            const { openSheet } = useUI();
            const p = PRODUCTS.find(x => x.id === productId);
            const [qty, setQty] = useState(1);
            if (!p) return null;
            const type = state.diagFull ? DIAG_TYPES[state.diagFull.typeKey] : null;
            const rec = type && type.products.includes(p.id);
            const addToCart = () => {
                update(s => { s.cart[p.id] = (s.cart[p.id] || 0) + qty; return s; });
                hapticYay();
                showToast(`カートに追加しました(${qty}点)`, 'success');
                onClose();
                setTimeout(() => openSheet('cart'), 250);
            };
            return (
                <Sheet title={p.cat} onClose={onClose}>
                    <div className="p-5 pb-8">
                        <div className="w-full aspect-[2/1] rounded-3xl bg-[#FAF7F0] border border-[#EFEAE0] flex items-center justify-center text-[76px]">{p.icon}</div>
                        {rec && <div className="mt-3 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-lav-pale text-lav-deep text-[10.5px] font-black">{type.emoji} 「{type.name}」のあなたへのAIおすすめ</div>}
                        <div className="font-black text-[18px] mt-2">{p.name}</div>
                        <div className="font-black text-[22px] text-night mt-1">{yen(p.price)} <span className="text-[10px] text-[#B9B2A6] font-bold">(税込)</span></div>
                        <p className="mt-3 text-[13px] font-bold text-[#6B655B] leading-relaxed">{p.desc}</p>
                        {p.ticket && (
                            <div className="mt-3 p-3.5 rounded-2xl bg-mint-pale text-[11.5px] font-bold text-[#3E8B69] leading-relaxed">🎫 購入するとアプリの回数券残高にすぐ<span className="font-black">+{p.ticket}回</span>チャージされます。</div>
                        )}
                        <div className="mt-4 flex items-center gap-3">
                            <div className="flex items-center gap-1 bg-[#FAF7F0] rounded-full border border-[#E7E1D4] p-1">
                                <button onClick={() => setQty(Math.max(1, qty - 1))} className="btn-press w-9 h-9 rounded-full bg-white font-black text-[16px] text-[#8B857A]">−</button>
                                <span className="w-8 text-center font-black text-[15px]">{qty}</span>
                                <button onClick={() => setQty(qty + 1)} className="btn-press w-9 h-9 rounded-full bg-white font-black text-[16px] text-[#8B857A]">+</button>
                            </div>
                            <button onClick={addToCart} className="btn-press flex-1 py-3.5 rounded-2xl bg-night text-cream font-black text-[13.5px] shadow-lg">カートに入れる — {yen(p.price * qty)}</button>
                        </div>
                    </div>
                </Sheet>
            );
        };

        // カート/購入シート
        const CartSheet = ({ onClose }) => {
            const { state, update, addXp } = useApp();
            const [placed, setPlaced] = useState(null);
            const items = Object.entries(state.cart).map(([id, qty]) => ({ ...PRODUCTS.find(p => p.id === id), qty })).filter(x => x.name);
            const total = items.reduce((a, x) => a + x.price * x.qty, 0);

            const changeQty = (id, d) => update(s => {
                const q = (s.cart[id] || 0) + d;
                if (q <= 0) delete s.cart[id]; else s.cart[id] = q;
                return s;
            });
            const checkout = () => {
                hapticYay();
                const order = { id: uid(), date: todayYMD(), items: items.map(x => ({ id: x.id, name: x.name, price: x.price, qty: x.qty })), total };
                const ticketAdd = items.reduce((a, x) => a + (x.ticket ? x.ticket * x.qty : 0), 0);
                update(s => {
                    s.orders = [...s.orders, order];
                    s.cart = {};
                    if (ticketAdd > 0) {
                        s.tickets.balance += ticketAdd;
                        s.tickets.history = [...s.tickets.history, { date: todayYMD(), delta: +ticketAdd, note: '回数券をEC購入' }];
                    }
                    return s;
                });
                addXp('shop', 'ホームケア商品を購入');
                setPlaced({ order, ticketAdd });
            };

            if (placed) {
                return (
                    <Sheet title="ご注文ありがとうございます" onClose={onClose}>
                        <div className="p-6 text-center">
                            <SupiChan size={140} mood="wow" stageIdx={1} className="mx-auto" />
                            <div className="font-black text-[17px] mt-2">ご注文が完了しました🎉</div>
                            <div className="text-[12px] font-bold text-[#8B857A] mt-1.5 leading-relaxed">最短2〜3日でご自宅にお届けします。<br/>店頭での持ち帰りは不要です🚚</div>
                            {placed.ticketAdd > 0 && (
                                <div className="mt-3 p-3.5 rounded-2xl bg-mint-pale text-[12.5px] font-black text-[#3E8B69]">🎫 回数券 +{placed.ticketAdd}回チャージ!(残 {state.tickets.balance}回)</div>
                            )}
                            <div className="mt-3 p-3.5 rounded-2xl bg-[#FAF7F0] text-left">
                                {placed.order.items.map(it => (
                                    <div key={it.id} className="flex justify-between text-[12px] font-bold text-[#6B655B] py-1"><span>{it.name} ×{it.qty}</span><span>{yen(it.price * it.qty)}</span></div>
                                ))}
                                <div className="flex justify-between font-black text-[13.5px] border-t border-[#E7E1D4] mt-1.5 pt-2"><span>合計</span><span>{yen(placed.order.total)}</span></div>
                            </div>
                            <button onClick={onClose} className="btn-press w-full mt-4 py-3.5 rounded-2xl bg-night text-cream font-black text-[13.5px]">とじる</button>
                        </div>
                    </Sheet>
                );
            }

            return (
                <Sheet title={`カート(${cartCount(state.cart)}点)`} onClose={onClose}>
                    <div className="p-5 pb-8">
                        {items.length === 0 ? (
                            <div className="py-10 text-center">
                                <SupiChan size={110} mood="sleep" stageIdx={0} className="mx-auto" />
                                <div className="font-black text-[14px] mt-2 text-[#8B857A]">カートはからっぽメェ</div>
                                <div className="text-[11.5px] font-bold text-[#B9B2A6] mt-1">気になる商品をえらんでみよう</div>
                            </div>
                        ) : (
                            <div>
                                <div className="space-y-2.5">
                                    {items.map(x => (
                                        <div key={x.id} className="flex items-center gap-3 card p-3">
                                            <div className="w-12 h-12 rounded-xl bg-[#FAF7F0] flex items-center justify-center text-2xl flex-shrink-0">{x.icon}</div>
                                            <div className="flex-1 min-w-0">
                                                <div className="font-black text-[12px] leading-snug truncate">{x.name}</div>
                                                <div className="text-[12px] font-black text-[#8B857A] mt-0.5">{yen(x.price)}</div>
                                            </div>
                                            <div className="flex items-center gap-1">
                                                <button onClick={() => changeQty(x.id, -1)} className="btn-press w-8 h-8 rounded-full bg-[#FAF7F0] border border-[#E7E1D4] font-black text-[#8B857A]">−</button>
                                                <span className="w-7 text-center font-black text-[13.5px]">{x.qty}</span>
                                                <button onClick={() => changeQty(x.id, +1)} className="btn-press w-8 h-8 rounded-full bg-[#FAF7F0] border border-[#E7E1D4] font-black text-[#8B857A]">+</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-4 p-4 rounded-2xl bg-[#FAF7F0]">
                                    <div className="flex justify-between text-[12px] font-bold text-[#8B857A]"><span>小計</span><span>{yen(total)}</span></div>
                                    <div className="flex justify-between text-[12px] font-bold text-[#8B857A] mt-1"><span>送料</span><span className="text-mint font-black">無料(サロン会員)</span></div>
                                    <div className="flex justify-between font-black text-[16px] mt-2 pt-2 border-t border-[#E7E1D4]"><span>合計</span><span>{yen(total)}</span></div>
                                </div>
                                <button onClick={checkout} className="btn-press w-full mt-4 py-4 rounded-2xl text-cream font-black text-[14.5px] shadow-lg" style={{ background: 'linear-gradient(135deg,#5FBF97,#3E8B69)' }}>購入する(デモ決済)</button>
                                <div className="mt-2 text-[10px] font-bold text-[#B9B2A6] text-center">デモアプリのため実際の請求は発生しません</div>
                            </div>
                        )}
                    </div>
                </Sheet>
            );
        };

        // ============================================================
        // マイページ(回数券・来店履歴・実績・設定)
        // ============================================================
        const BADGES = [
            { id:'b_streak3',  icon:'🔥', name:'3日連続記録',   cond: s => calcStreak(s) >= 3 },
            { id:'b_streak7',  icon:'🌈', name:'7日連続記録',   cond: s => calcStreak(s) >= 7 },
            { id:'b_streak14', icon:'👑', name:'14日連続記録',  cond: s => calcStreak(s) >= 14 },
            { id:'b_edu5',     icon:'📚', name:'知識コレクター(5本読了)', cond: s => s.eduRead.length >= 5 },
            { id:'b_educomp',  icon:'🎓', name:'眠りの教科書コンプ', cond: s => s.eduRead.length >= EDU_ARTICLES.length },
            { id:'b_diag',     icon:'🧠', name:'本診断マスター', cond: s => !!s.diagFull },
            { id:'b_posture',  icon:'🩻', name:'姿勢分析デビュー', cond: s => s.postures.length > 0 },
            { id:'b_shop',     icon:'🛍️', name:'ホームケアデビュー', cond: s => s.orders.length > 0 },
            { id:'b_visit3',   icon:'🏪', name:'3回来店', cond: s => s.visits.length >= 3 },
            { id:'b_lv10',     icon:'⭐', name:'レベル10到達', cond: s => levelFromXp(s.xp) >= 10 },
        ];

        const MyPageView = () => {
            const { state, update, setState } = useApp();
            const { openSheet } = useUI();
            const [editName, setEditName] = useState(false);
            const [nameDraft, setNameDraft] = useState(state.profile.name);
            const p = xpProgress(state.xp);
            const stage = supiStage(p.lv);
            const earned = BADGES.filter(b => b.cond(state));
            const ticketHistory = [...state.tickets.history].reverse().slice(0, 8);
            const monthLogs = Object.entries(state.sleepLogs).sort((a, b) => a[0] < b[0] ? 1 : -1).slice(0, 30);
            const avg30 = monthLogs.length ? Math.round(monthLogs.reduce((a, [, l]) => a + l.score, 0) / monthLogs.length) : null;

            return (
                <div className="pb-28">
                    <div className="relative overflow-hidden" style={{ background: 'linear-gradient(175deg,#0C1526,#182642)' }}>
                        <StarrySky density={16} shooting={false} />
                        <div className="relative max-w-lg mx-auto px-5 pt-6 pb-5 flex items-center gap-4">
                            <div className="w-16 h-16 rounded-full bg-white/10 border-2 border-star/40 flex items-center justify-center overflow-hidden flex-shrink-0">
                                <SupiChan size={54} mood="sleep" stageIdx={SUPI_STAGES.indexOf(stage)} showZzz={false} animate={false} />
                            </div>
                            <div className="flex-1 min-w-0">
                                {editName ? (
                                    <div className="flex gap-2">
                                        <input value={nameDraft} onChange={e => setNameDraft(e.target.value)} className="flex-1 min-w-0 rounded-xl px-3 py-1.5 text-[14px] font-black bg-white/10 text-cream border border-white/20" />

        };

        // ============================================================
        // 姿勢分析エンジン
        // (サロンダッシュボードの姿勢分析ツールと同一ロジック/論文根拠つき)
        // ============================================================
        // [POSTURE-ENGINE-START]
        const POSTURE_LM = {
            NOSE:0,LEFT_EYE:1,RIGHT_EYE:2,LEFT_EAR:3,RIGHT_EAR:4,
            LEFT_SHOULDER:11,RIGHT_SHOULDER:12,LEFT_HIP:23,RIGHT_HIP:24,
            LEFT_KNEE:25,RIGHT_KNEE:26,LEFT_ANKLE:27,RIGHT_ANKLE:28,
            LEFT_ELBOW:13,RIGHT_ELBOW:14,LEFT_WRIST:15,RIGHT_WRIST:16,
        };
        function postureCalcAngle(a,b,c){
            const ab={x:a.x-b.x,y:a.y-b.y},cb={x:c.x-b.x,y:c.y-b.y};
            const dot=ab.x*cb.x+ab.y*cb.y;
            const m1=Math.sqrt(ab.x**2+ab.y**2),m2=Math.sqrt(cb.x**2+cb.y**2);
            if(!m1||!m2) return 0;
            return Math.acos(Math.min(1,Math.max(-1,dot/(m1*m2))))*(180/Math.PI);
        }
        function postureMid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
        function postureLmConfidence(...lms){ const vs = lms.filter(l=>l&&l.visibility!=null).map(l=>l.visibility); return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : 0; }
        const POSTURE_REF_SHOULDER_WIDTH_CM = 38;
        const POSTURE_REF_SH_HIP_DIST_CM = 42;

        function postureAnalyzeFront(lm){
            const L=POSTURE_LM, ls=lm[L.LEFT_SHOULDER],rs=lm[L.RIGHT_SHOULDER];
            const lh=lm[L.LEFT_HIP],rh=lm[L.RIGHT_HIP],nose=lm[L.NOSE];
            const sMid=postureMid(ls,rs), hMid=postureMid(lh,rh);
            const shoulderWidth = Math.sqrt((rs.x-ls.x)**2 + (rs.y-ls.y)**2);
            const refLen = shoulderWidth > 0.01 ? shoulderWidth : 0.2;
            const shoulderDx = rs.x - ls.x, shoulderDy = rs.y - ls.y;
            const shoulderAngle = Math.abs(Math.atan2(shoulderDy, shoulderDx) * (180/Math.PI));
            const shoulderTilt = Math.abs(shoulderAngle - 180);
            const shoulderScore =
                shoulderTilt <= 2 ? Math.round(100 - shoulderTilt * 5) :
                shoulderTilt <= 5 ? Math.round(90 - (shoulderTilt-2) * 6.7) :
                shoulderTilt <= 10 ? Math.round(70 - (shoulderTilt-5) * 6) :
                Math.round(Math.max(0, 40 - (shoulderTilt-10) * 4));
            const hipDx = rh.x - lh.x, hipDy = rh.y - lh.y;
            const hipAngle = Math.abs(Math.atan2(hipDy, hipDx) * (180/Math.PI));
            const hipTilt = Math.abs(hipAngle - 180);
            const hipScore =
                hipTilt <= 2 ? Math.round(100 - hipTilt * 5) :
                hipTilt <= 5 ? Math.round(90 - (hipTilt-2) * 6.7) :
                hipTilt <= 10 ? Math.round(70 - (hipTilt-5) * 6) :
                Math.round(Math.max(0, 40 - (hipTilt-10) * 4));
            const headOffsetRaw = Math.abs(nose.x - sMid.x);
            const headOffset = (headOffsetRaw / refLen) * 6;
            const headScore =
                headOffset <= 1.5 ? Math.round(100 - headOffset * 6.7) :
                headOffset <= 3 ? Math.round(90 - (headOffset-1.5) * 13.3) :
                headOffset <= 5 ? Math.round(70 - (headOffset-3) * 15) :
                Math.round(Math.max(0, 40 - (headOffset-5) * 8));
            const centerOffsetRaw = Math.abs(sMid.x - hMid.x);
            const centerOffset = (centerOffsetRaw / refLen) * 6;
            const centerScore =
                centerOffset <= 1.5 ? Math.round(100 - centerOffset * 6.7) :
                centerOffset <= 3 ? Math.round(90 - (centerOffset-1.5) * 13.3) :
                centerOffset <= 5 ? Math.round(70 - (centerOffset-3) * 15) :
                Math.round(Math.max(0, 40 - (centerOffset-5) * 8));
            const cmPerUnit = POSTURE_REF_SHOULDER_WIDTH_CM / refLen;
            return {items:[
                { key:'shoulder', label:'肩の左右バランス', score: shoulderScore, confidence: postureLmConfidence(ls, rs),
                  detail: shoulderTilt < 1 ? '均等' : ls.y < rs.y ? '左肩が高い' : '右肩が高い',
                  value: shoulderTilt.toFixed(1) + '°', valueCm: (Math.abs(shoulderDy)*cmPerUnit).toFixed(1) + 'cm',
                  reference: { authors:'Fortin C, Feldman DE, Cheriet F, Labelle H', year:2011, journal:'Disability and Rehabilitation, 33(5):367-383', doi:'10.3109/09638288.2010.492066', pmid:'20568973',
                    finding:'フォトグラメトリーによる肩傾斜角の測定は高い信頼性(ICC>0.90)。2°以内が正常範囲、15°以上で側弯症の兆候。' } },
                { key:'hip', label:'骨盤の左右バランス', score: hipScore, confidence: postureLmConfidence(lh, rh),
                  detail: hipTilt < 1 ? '均等' : lh.y < rh.y ? '左が高い' : '右が高い',
                  value: hipTilt.toFixed(1) + '°', valueCm: (Math.abs(hipDy)*cmPerUnit).toFixed(1) + 'cm',
                  reference: { authors:'Herrington L', year:2011, journal:'Manual Therapy, 16(6):646-648', doi:'10.1016/j.math.2011.04.006', pmid:'21658988',
                    finding:'無症状者120名で骨盤傾斜角の正常値を報告。PALM法で左右差2°以内が正常範囲。骨盤の左右非対称は全身の歪み指標となる。' } },
                { key:'head', label:'頭部の傾き', score: headScore, confidence: postureLmConfidence(nose, ls, rs),
                  detail: headOffset < 1 ? '正中' : nose.x < sMid.x ? '左に傾斜' : '右に傾斜',
                  value: headOffset.toFixed(1) + '%偏位', valueCm: (headOffsetRaw*cmPerUnit).toFixed(1) + 'cm',
                  reference: { authors:'Singla D, Veqar Z', year:2017, journal:'J Chiropractic Medicine, 16(2):131-138', doi:'10.1016/j.jcm.2017.01.005', pmid:'28559753',
                    finding:'フォトグラメトリーによる冠状面の頭部傾斜評価は中〜高の検者内信頼性(ICC=0.82-0.95)。1.5%以内の偏位が正常範囲。' } },
                { key:'center', label:'重心の左右ズレ', score: centerScore, confidence: postureLmConfidence(ls, rs, lh, rh),
                  detail: centerOffset < 1 ? '正中' : sMid.x < hMid.x ? '左にズレ' : '右にズレ',
                  value: centerOffset.toFixed(1) + '%偏位', valueCm: (centerOffsetRaw*cmPerUnit).toFixed(1) + 'cm',
                  reference: { authors:'Ferreira EA, Duarte M, Maldonado EP, Burke TN, Marques AP', year:2010, journal:'Clinics (São Paulo), 65(7):675-681', doi:'10.1590/S1807-59322010000700005', pmid:'20668624',
                    finding:'姿勢評価ソフトウェアSAPOの妥当性・信頼性を検証。角度・距離ともに高い検者間・検者内信頼性を確認(ICC=0.90-0.98)。' } },
            ]};
        }
        function postureAnalyzeBack(lm){
            const L=POSTURE_LM, ls=lm[L.LEFT_SHOULDER],rs=lm[L.RIGHT_SHOULDER];
            const lh=lm[L.LEFT_HIP],rh=lm[L.RIGHT_HIP],nose=lm[L.NOSE];
            const sMid=postureMid(ls,rs), hMid=postureMid(lh,rh);
            const shoulderWidth = Math.sqrt((rs.x-ls.x)**2 + (rs.y-ls.y)**2);
            const refLen = shoulderWidth > 0.01 ? shoulderWidth : 0.2;
            const shoulderDy = rs.y - ls.y;
            const shoulderAngle = Math.abs(Math.atan2(shoulderDy, rs.x - ls.x) * (180/Math.PI));
            const shoulderTilt = Math.abs(shoulderAngle - 180);
            const shoulderScore =
                shoulderTilt <= 2 ? Math.round(100 - shoulderTilt * 5) :
                shoulderTilt <= 5 ? Math.round(90 - (shoulderTilt-2) * 6.7) :
                shoulderTilt <= 10 ? Math.round(70 - (shoulderTilt-5) * 6) :
                Math.round(Math.max(0, 40 - (shoulderTilt-10) * 4));
            const hipDy = rh.y - lh.y;
            const hipAngle = Math.abs(Math.atan2(hipDy, rh.x - lh.x) * (180/Math.PI));
            const hipTilt = Math.abs(hipAngle - 180);
            const hipScore =
                hipTilt <= 2 ? Math.round(100 - hipTilt * 5) :
                hipTilt <= 5 ? Math.round(90 - (hipTilt-2) * 6.7) :
                hipTilt <= 10 ? Math.round(70 - (hipTilt-5) * 6) :
                Math.round(Math.max(0, 40 - (hipTilt-10) * 4));
            const spineDeviation = (function(){
                if (!nose || nose.visibility < 0.5) return 0;
                const vx = sMid.x - hMid.x, vy = sMid.y - hMid.y;
                const len = Math.sqrt(vx*vx + vy*vy);
                if (len < 0.001) return 0;
                const hx = nose.x - sMid.x, hy = nose.y - sMid.y;
                const cross = (vx * hy - vy * hx) / len;
                return (Math.abs(cross) / refLen) * 6;
            })();
            const spineScore =
                spineDeviation <= 1 ? Math.round(100 - spineDeviation * 5) :
                spineDeviation <= 2.5 ? Math.round(95 - (spineDeviation-1) * 10) :
                spineDeviation <= 5 ? Math.round(80 - (spineDeviation-2.5) * 12) :
                Math.round(Math.max(0, 50 - (spineDeviation-5) * 6));
            const trunkLateral = (Math.abs(sMid.x - hMid.x) / refLen) * 6;
            const trunkScore =
                trunkLateral <= 1.5 ? Math.round(100 - trunkLateral * 6.7) :
                trunkLateral <= 3 ? Math.round(90 - (trunkLateral-1.5) * 13.3) :
                trunkLateral <= 5 ? Math.round(70 - (trunkLateral-3) * 15) :
                Math.round(Math.max(0, 40 - (trunkLateral-5) * 8));
            const cmPerUnit = POSTURE_REF_SHOULDER_WIDTH_CM / refLen;
            return {items:[
                { key:'shoulder', label:'肩の左右バランス', score: shoulderScore, confidence: postureLmConfidence(ls, rs),
                  detail: shoulderTilt < 1 ? '均等' : ls.y < rs.y ? '左肩が高い' : '右肩が高い',
                  value: shoulderTilt.toFixed(1) + '°', valueCm: (Math.abs(shoulderDy)*cmPerUnit).toFixed(1) + 'cm',
                  reference: { authors:'Fortin C, Feldman DE, Cheriet F, Labelle H', year:2011, journal:'Disability and Rehabilitation, 33(5):367-383', doi:'10.3109/09638288.2010.492066', pmid:'20568973',
                    finding:'フォトグラメトリーによる肩傾斜角の測定は高い信頼性(ICC>0.90)。2°以内が正常範囲、15°以上で側弯症の兆候。' } },
                { key:'hip', label:'骨盤の左右バランス', score: hipScore, confidence: postureLmConfidence(lh, rh),
                  detail: hipTilt < 1 ? '均等' : lh.y < rh.y ? '左が高い' : '右が高い',
                  value: hipTilt.toFixed(1) + '°', valueCm: (Math.abs(hipDy)*cmPerUnit).toFixed(1) + 'cm',
                  reference: { authors:'Herrington L', year:2011, journal:'Manual Therapy, 16(6):646-648', doi:'10.1016/j.math.2011.04.006', pmid:'21658988',
                    finding:'無症状者120名で骨盤傾斜角の正常値を報告。PALM法で左右差2°以内が正常範囲。' } },

                    finding:'姿勢評価ソフトウェアSAPOによる体幹傾斜の測定は高い信頼性(ICC=0.90-0.98)。肩-腰の水平ズレで評価。' } },

        function postureAnalyzeSide(lm){

                    finding:'FHP群と健常群25名ずつで立位・座位のCVAを比較。CVA 50°未満を前方頭位(FHP)と定義。健常群の平均CVAは立位で約55°。' } },

        function postureAnalyzeSeated(lm){

                estimatedCVA >= 50 ? Math.round(Math.min(100, 85 + (estimatedCVA-50)*3)) :
                estimatedCVA >= 45 ? Math.round(60 + (estimatedCVA-45)*5) :

            return {items:[
                { key:'head', label:'頭部前方偏位(座位)', score: headScore, confidence: postureLmConfidence(ear, sh),

                { key:'shoulder', label:'巻き肩・猫背(座位)', score: shoulderScore, confidence: postureLmConfidence(ear, sh, hip),
                  detail: shAngle >= 155 ? '正常' : shAngle >= 145 ? '軽度の猫背' : '猫背傾向',
                  value: shAngle.toFixed(0) + '°', valueCm: '',
                  reference: { authors:'Singla D, Veqar Z', year:2017, journal:'J Chiropractic Medicine, 16(3):220-229', doi:'10.1016/j.jcm.2017.03.004', pmid:'29097952',
                    finding:'座位での矢状面肩角は立位より基準がやや緩い(155°以上が正常目安)。前方頭位と巻き肩・胸椎後弯は相互に関連。' } },
                { key:'trunk', label:'体幹の傾き', score: trunkScore, confidence: postureLmConfidence(sh, hip),

                    finding:'座位での頸椎前方偏位のある女性事務員は上部僧帽筋の硬直度が11.3%高い。座位体幹傾斜2%以内が理想。' } },

                  detail: headVsHip < 3 ? '良好' : nose.x > hip.x ? '頭部が前方' : '頭部が後方',
                  value: headVsHip.toFixed(1) + '%', valueCm: (Math.abs(nose.x-hip.x)*cmPerUnitSeated).toFixed(1) + 'cm',

        // [POSTURE-ENGINE-END]

        const POSTURE_VIEWS = [

        // デモ用サンプル骨格(カメラなしで体験)

        const DEMO_LMS = {

                        const n = frames.length;
                        averaged.push({ x: sx/n, y: sy/n, z: sz/n, visibility: sv/n });
                    }
                    setLandmarks(averaged);
                }
                stopCam();
                hapticYay();
                setMode('result');
            }, [stopCam]);

            const runDemo = () => {
                hapticTap();
                stopCam();
                setIsDemo(true); setSaved(false);
                setLandmarks(demoLmFor(view, phasePick));
                setMode('result');
            };

            const saveResult = () => {
                if (!analysis || total == null || saved) return;
                const entry = {
                    id: uid(), date: todayYMD(), phase: phasePick, view, total, demo: isDemo,
                    items: analysis.items.map(i => ({ key: i.key, label: i.label, score: i.score, value: i.value, detail: i.detail })),
                };
                update(s => { s.postures = [...s.postures, entry]; return s; });
                addXp('posture', `姿勢分析(${phasePick === 'before' ? '施術前' : '施術後'})`);
                setSaved(true);
                const hasPair = phasePick === 'after' && state.postures.some(p => p.view === view && p.phase === 'before');
                if (hasPair) {
                    setTimeout(() => { onClose(); setTimeout(() => openSheet('postureReport'), 250); }, 900);
                }
            };

            const viewDef = POSTURE_VIEWS.find(v => v.key === view);
            const hasBeforeForView = state.postures.some(p => p.view === view && p.phase === 'before');

            return (
                <Sheet title="AI姿勢分析" onClose={() => { stopCam(); onClose(); }} wide>
                    <div className="p-5 pb-8">
                        {/* Before/After 切替 */}
                        <div className="flex gap-1 p-1 rounded-2xl bg-[#EFEAE0]">
                            {[{ k:'before', l:'Before(施術前)', c:'#4A76A8' }, { k:'after', l:'After(施術後)', c:'#B9860F' }].map(o => (
                                <button key={o.k} onClick={() => { setPhasePick(o.k); if (mode === 'result') { setMode('menu'); setLandmarks(null); setSaved(false); } }}
                                    className={`btn-press flex-1 py-2.5 rounded-xl text-[12px] font-black transition ${phasePick === o.k ? 'bg-white shadow' : 'text-[#B9B2A6]'}`}
                                    style={phasePick === o.k ? { color: o.c } : {}}>
                                    {o.l}
                                </button>
                            ))}
                        </div>
                        {/* ビュー切替 */}
                        <div className="flex gap-1 p-1 rounded-2xl bg-[#EFEAE0] mt-2">
                            {POSTURE_VIEWS.map(v => (
                                <button key={v.key} onClick={() => { setView(v.key); if (mode === 'result') { setMode('menu'); setLandmarks(null); setSaved(false); } }}
                                    className={`btn-press flex-1 py-2 rounded-xl text-[12px] font-black transition relative ${view === v.key ? 'bg-white shadow text-night' : 'text-[#B9B2A6]'}`}>
                                    {v.label}
                                    {state.postures.some(p => p.view === v.key) && <span className="absolute top-1 right-1.5 w-1.5 h-1.5 rounded-full bg-mint" />}
                                </button>
                            ))}
                        </div>

                        {/* ビューポート */}
                        <div className="relative rounded-3xl overflow-hidden mt-3" style={{ aspectRatio: '9/16', maxHeight: '52vh', margin: '0 auto', background: '#101A2E' }}>
                            <video ref={videoRef} playsInline muted className="w-full h-full object-cover" style={{ display: mode === 'live' ? 'block' : 'none' }} />
                            {mode !== 'live' && <StarrySky density={14} shooting={false} />}
                            {(mode === 'live' || mode === 'result') && gridOn && (
                                <svg viewBox="0 0 90 160" className="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none">
                                    {[15,30,45,60,75].map(x => <line key={'v'+x} x1={x} y1="10" x2={x} y2="150" stroke={x===45 ? 'rgba(168,198,232,.55)' : 'rgba(226,75,74,.22)'} strokeWidth={x===45 ? 0.7 : 0.4} />)}
                                    {[30,50,70,90,110,130].map(y => <line key={'h'+y} x1="6" y1={y} x2="84" y2={y} stroke={y===90 ? 'rgba(168,198,232,.55)' : 'rgba(226,75,74,.22)'} strokeWidth={y===90 ? 0.7 : 0.4} />)}
                                </svg>
                            )}
                            {(mode === 'live' || mode === 'result') && <PostureSkeleton landmarks={landmarks} view={view} />}
                            {mode === 'menu' && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center gap-3 px-6 text-center">
                                    <SupiChan size={92} mood="happy" stageIdx={0} showZzz={false} />
                                    <div className="text-cream/85 text-[12px] font-black leading-relaxed">{viewDef.guide}</div>
                                    <div className="text-cream/45 text-[10px] font-bold">スタッフが撮影をお手伝いします</div>
                                </div>
                            )}
                            {mode === 'loading' && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-black/50">
                                    <div className="w-9 h-9 rounded-full animate-spin" style={{ border: '3px solid rgba(255,255,255,.2)', borderTopColor: '#F6CE6E' }} />
                                    <div className="text-cream text-[12px] font-black">カメラと姿勢AIを準備中…</div>
                                </div>
                            )}
                            {mode === 'live' && (
                                <div className="absolute top-3 right-3 flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-black/50">
                                    <span className="w-2 h-2 rounded-full bg-red-400 animate-pulse" /><span className="text-white text-[10px] font-black">LIVE</span>
                                </div>
                            )}
                            {mode === 'result' && total != null && (
                                <div className="absolute top-3 left-3 flex items-center gap-2 px-3 py-2 rounded-2xl bg-black/55" style={{ backdropFilter: 'blur(4px)' }}>
                                    <div className="w-9 h-9 rounded-full flex items-center justify-center border-[3px]" style={{ borderColor: scoreColor(total) }}>
                                        <span className="text-[13px] font-black" style={{ color: scoreColor(total) }}>{total}</span>
                                    </div>
                                    <div>
                                        <div className="text-[10px] font-black" style={{ color: scoreColor(total) }}>{scoreWord(total)}</div>
                                        <div className="text-[8.5px] font-bold text-white/60">{viewDef.label} / {phasePick === 'before' ? '施術前' : '施術後'}{isDemo ? '(デモ)' : ''}</div>
                                    </div>
                                </div>
                            )}
                            {/* 下部ボタン(ビューポート内) */}
                            {mode === 'live' && (
                                <div className="absolute bottom-0 inset-x-0 p-3.5 flex gap-2" style={{ background: 'linear-gradient(transparent, rgba(0,0,0,.65))' }}>
                                    <button onClick={capture} className="btn-press flex-1 py-3 rounded-2xl text-white font-black text-[13px]" style={{ background: 'rgba(95,191,151,.95)' }}>📸 撮影して分析</button>
                                    <button onClick={() => { stopCam(); setMode('menu'); }} className="btn-press px-4 py-3 rounded-2xl bg-white/90 text-[#555] font-black text-[13px]">停止</button>
                                </div>
                            )}
                        </div>

                        {errorMsg && <div className="mt-2.5 p-3 rounded-xl bg-blush/15 text-[#C25A50] text-[11.5px] font-bold">{errorMsg}</div>}

                        {mode === 'menu' && (
                            <div className="mt-3 space-y-2">
                                <button onClick={startCamera} className="btn-press w-full py-3.5 rounded-2xl text-cream font-black text-[13.5px] shadow-lg" style={{ background: 'linear-gradient(135deg,#22335A,#101A2E)' }}>📷 カメラを起動して撮影</button>
                                <button onClick={runDemo} className="btn-press w-full py-3 rounded-2xl bg-white border-2 border-dashed border-lav text-lav-deep font-black text-[12.5px]">🐑 カメラなしで体験(サンプル骨格で{phasePick === 'before' ? 'Before' : 'After'}を再現)</button>
                                {phasePick === 'after' && !hasBeforeForView && (
                                    <div className="p-3 rounded-xl bg-[#FFF6E3] text-[11px] font-bold text-[#8B6B3A]">💡 先に「Before(施術前)」を{POSTURE_VIEWS.find(v=>v.key===view).label}で保存しておくと、施術後に自動でビフォーアフター比較ができます</div>
                                )}
                            </div>
                        )}

                        {(mode === 'live' || mode === 'result') && (
                            <div className="mt-2.5 flex items-center justify-end gap-2">
                                <button onClick={() => setGridOn(!gridOn)} className={`btn-press px-3 py-1.5 rounded-full text-[10.5px] font-black border ${gridOn ? 'bg-night text-cream border-night' : 'bg-white text-[#B9B2A6] border-[#E7E1D4]'}`}>方眼 {gridOn ? 'ON' : 'OFF'}</button>
                            </div>
                        )}

                        {/* 結果 */}
                        {mode === 'result' && analysis && total != null && (
                            <div className="mt-3 space-y-3">
                                <div className="card p-4 flex items-center gap-4">
                                    <ScoreRing score={total} size={96} sub={scoreWord(total)} />
                                    <div className="flex-1">
                                        <div className="font-black text-[13.5px]">{viewDef.label}の姿勢スコア</div>
                                        <div className="text-[11.5px] font-bold text-[#6B655B] leading-relaxed mt-1">{
                                            total >= 80 ? '姿勢はとても良い状態。「眠れる体」の土台ができています✨'
                                            : total >= 60 ? '軽度のゆがみがあります。呼吸と眠りへの影響が出始めるレベルです'
                                            : total >= 40 ? '複数の項目で改善が必要。眠りの浅さ・こりの一因になっている可能性大'
                                            : 'ゆがみが強めです。施術で「眠れる姿勢」に整えていきましょう'
                                        }</div>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    {analysis.items.map(item => {
                                        const low = item.confidence != null && item.confidence < 0.5;
                                        return (
                                            <div key={item.key} className="card p-3.5" style={{ opacity: low ? 0.65 : 1 }}>
                                                <div className="flex items-center justify-between">
                                                    <div className="flex-1">
                                                        <div className="text-[12.5px] font-black flex items-center gap-1.5">
                                                            {item.label}
                                                            {low && <span className="text-[9px] px-1.5 py-0.5 rounded bg-[#FCF3E4] text-[#B9860F] font-black">検出低</span>}
                                                        </div>
                                                        <div className="text-[10.5px] font-bold text-[#8B857A] mt-0.5">{low ? '再撮影推奨' : `${item.detail} — ${item.value}${item.valueCm ? '(約' + item.valueCm + ')' : ''}`}</div>
                                                    </div>
                                                    <div className="flex items-center gap-1.5">
                                                        <div className="min-w-[42px] h-7 px-2 rounded-full flex items-center justify-center text-white text-[13px] font-black" style={{ background: low ? '#B9B2A6' : scoreColor(item.score) }}>{low ? '–' : item.score}</div>
                                                        {item.reference && <button onClick={() => setRefModal(item)} className="btn-press w-7 h-7 rounded-full bg-[#FAF7F0] text-[13px]" title="論文根拠">📖</button>}
                                                    </div>
                                                </div>
                                                {!low && POSTURE_SLEEP_NOTES[item.key] && item.score < 80 && (
                                                    <div className="mt-2 p-2.5 rounded-xl bg-lav-pale text-[10.5px] font-bold text-[#5A5470] leading-relaxed">
                                                        <span className="font-black text-lav-deep">☾ 睡眠とのつながり: </span>{POSTURE_SLEEP_NOTES[item.key]}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex gap-2">
                                    <button onClick={saveResult} disabled={saved}
                                        className={`btn-press flex-1 py-3.5 rounded-2xl font-black text-[13.5px] text-white shadow-lg ${saved ? 'opacity-60' : ''}`}
                                        style={{ background: phasePick === 'before' ? 'linear-gradient(135deg,#4A76A8,#365A85)' : 'linear-gradient(135deg,#E8A03C,#C9861F)' }}>
                                        {saved ? '✓ 保存しました' : `${phasePick === 'before' ? 'Before' : 'After'}として保存(+30XP)`}
                                    </button>
                                    <button onClick={() => { setMode('menu'); setLandmarks(null); setSaved(false); }} className="btn-press px-4 py-3.5 rounded-2xl bg-[#EFEAE0] text-[#6B655B] font-black text-[13px]">やり直す</button>
                                </div>
                                {saved && phasePick === 'before' && (
                                    <div className="p-3 rounded-xl bg-mint-pale text-[11.5px] font-bold text-[#3E8B69] text-center anim-fade-up">保存OK!施術のあとに「After」を撮ると、変化が見えるメェ🐑</div>
                                )}
                            </div>
                        )}

                        {/* 論文根拠モーダル */}
                        {refModal && (
                            <div className="fixed inset-0 z-[1100] flex items-center justify-center p-5 anim-fade" style={{ background: 'rgba(16,26,46,.6)' }} onClick={() => setRefModal(null)}>
                                <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-5 anim-pop max-h-[80vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                                    <div className="flex items-center justify-between mb-3">
                                        <div className="font-black text-[14.5px]">{refModal.label}</div>
                                        <button onClick={() => setRefModal(null)} className="w-8 h-8 rounded-full bg-[#EFEAE0] font-black">×</button>
                                    </div>
                                    <div className="flex items-center gap-2 mb-3">
                                        <div className="min-w-[42px] h-7 px-2 rounded-full flex items-center justify-center text-white text-[13px] font-black" style={{ background: scoreColor(refModal.score) }}>{refModal.score}</div>
                                        <span className="text-[12px] font-bold text-[#6B655B]">{refModal.detail} — {refModal.value}</span>
                                    </div>
                                    <div className="bg-lav-pale rounded-2xl p-4 space-y-2 text-[11.5px] font-bold text-[#5A5470]">
                                        <div className="font-black text-lav-deep text-[11.5px]">📚 査読付き学術論文にもとづく評価</div>
                                        <div><span className="font-black">著者: </span>{refModal.reference.authors}({refModal.reference.year})</div>
                                        <div><span className="font-black">掲載誌: </span>{refModal.reference.journal}</div>
                                        {refModal.reference.doi && <div className="break-all"><span className="font-black">DOI: </span><a className="text-lav-deep underline" href={'https://doi.org/' + refModal.reference.doi} target="_blank" rel="noopener noreferrer">{refModal.reference.doi}</a></div>}
                                        {refModal.reference.pmid && <div><span className="font-black">PubMed: </span><a className="text-lav-deep underline" href={'https://pubmed.ncbi.nlm.nih.gov/' + refModal.reference.pmid + '/'} target="_blank" rel="noopener noreferrer">PMID {refModal.reference.pmid}</a></div>}
                                        <div className="pt-2 border-t border-lav/20"><span className="font-black">知見: </span>{refModal.reference.finding}</div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </Sheet>
            );
        };

        // ============================================================
        // ビフォーアフター比較レポート(AI再評価・ステップ7&8)
        // ============================================================
        const PostureReportSheet = ({ onClose }) => {
            const { state } = useApp();
            const { setTab } = useUI();
            // ビューごとに最新のbefore/afterペアを作る
            const pairs = POSTURE_VIEWS.map(v => {
                const before = [...state.postures].reverse().find(p => p.view === v.key && p.phase === 'before');
                const after = [...state.postures].reverse().find(p => p.view === v.key && p.phase === 'after');
                return before && after ? { view: v, before, after } : null;
            }).filter(Boolean);

            const totalDiff = pairs.length ? Math.round(pairs.reduce((a, p) => a + (p.after.total - p.before.total), 0) / pairs.length) : 0;

            return (
                <Sheet title="ビフォーアフター比較レポート" onClose={onClose} wide>
                    <div className="p-5 pb-8 space-y-4">
                        {pairs.length === 0 ? (
                            <div className="py-8 text-center">
                                <SupiChan size={110} mood="sleep" stageIdx={0} className="mx-auto" />
                                <div className="font-black text-[14px] mt-2 text-[#6B655B]">まだ比較できるデータがありません</div>
                                <p className="text-[11.5px] font-bold text-[#B9B2A6] mt-1.5 leading-relaxed">同じ向きで「Before(施術前)」と「After(施術後)」を<br/>保存すると、ここに変化レポートが表示されます</p>
                            </div>
                        ) : (
                            <React.Fragment>
                                <div className="rounded-3xl p-5 text-center relative overflow-hidden" style={{ background: 'linear-gradient(150deg,#101A2E,#22335A)' }}>
                                    <StarrySky density={14} shooting={false} />
                                    <div className="relative">
                                        <div className="text-[10px] font-black tracking-[.25em] text-star/80">AI RE-EVALUATION</div>
                                        <div className="text-cream font-black text-[16px] mt-1">施術によるからだの変化</div>
                                        <div className={`mt-3 inline-flex items-center gap-2 px-5 py-2 rounded-full text-[15px] font-black ${totalDiff >= 0 ? 'bg-mint/20 text-mint' : 'bg-blush/20 text-blush'}`}>
                                            {totalDiff >= 0 ? '▲' : '▼'} 平均 {totalDiff >= 0 ? '+' : ''}{totalDiff}点 {totalDiff >= 0 ? '改善' : ''}
                                        </div>
                                        <div className="mt-2 text-cream/60 text-[10.5px] font-bold">{fmtJP(pairs[0].after.date)} 実施</div>
                                    </div>
                                </div>

                                {pairs.map(({ view: v, before, after }) => {
                                    const d = after.total - before.total;
                                    return (
                                        <div key={v.key} className="card p-4">
                                            <div className="font-black text-[13.5px] mb-2.5">📐 {v.label}の変化</div>
                                            <div className="flex items-center gap-3">
                                                <div className="flex-1 text-center p-3 rounded-2xl" style={{ background: '#F0F5FA' }}>
                                                    <div className="text-[9.5px] font-black text-[#4A76A8]">BEFORE</div>
                                                    <div className="text-[26px] font-black leading-tight" style={{ color: scoreColor(before.total) }}>{before.total}</div>
                                                </div>
                                                <div className="text-center px-1">
                                                    <div className={`text-[19px] font-black ${d >= 0 ? 'text-mint' : 'text-[#C25A50]'}`}>{d >= 0 ? '+' : ''}{d}</div>
                                                    <div className={`text-[9px] font-black ${d >= 0 ? 'text-mint' : 'text-[#C25A50]'}`}>{d >= 0 ? '改善 ▲' : '低下 ▼'}</div>
                                                </div>
                                                <div className="flex-1 text-center p-3 rounded-2xl" style={{ background: '#FCF6E8' }}>
                                                    <div className="text-[9.5px] font-black text-[#B9860F]">AFTER</div>
                                                    <div className="text-[26px] font-black leading-tight" style={{ color: scoreColor(after.total) }}>{after.total}</div>
                                                </div>
                                            </div>
                                            <div className="mt-2.5 space-y-1">
                                                {before.items.map((bi, i) => {
                                                    const ai = after.items[i];
                                                    if (!ai) return null;
                                                    const dd = ai.score - bi.score;
                                                    return (
                                                        <div key={bi.key} className="flex items-center py-1.5 border-b border-[#F4F1EA] last:border-0 text-[11.5px] font-bold">
                                                            <span className="flex-1 font-black text-[#4A453C]">{bi.label}</span>
                                                            <span className="text-[#B9B2A6] w-16 text-right">{bi.score} → {ai.score}</span>
                                                            <span className={`w-10 text-right font-black ${dd >= 0 ? 'text-mint' : 'text-[#C25A50]'}`}>{dd >= 0 ? '+' : ''}{dd}</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}

                                <div className="card p-4" style={{ background: '#F4F1FB', border: '1px solid rgba(157,143,216,.35)' }}>
                                    <div className="text-[12px] font-black text-lav-deep mb-1.5">☾ この変化が眠りにつながる理由</div>
                                    <p className="text-[12px] font-bold text-[#5A5470] leading-relaxed">
                                        姿勢が整うと胸がひらいて呼吸が深くなり、休息の神経(副交感神経)へのスイッチが入りやすくなります。今夜の睡眠はいつもより深くなりやすい状態。<span className="font-black">今夜の睡眠を記録して、体の変化と眠りの変化をセットで確認</span>してみましょう。
                                    </p>
                                    <button onClick={() => { onClose(); setTimeout(() => setTab('sleep'), 120); }} className="btn-press w-full mt-3 py-3 rounded-2xl bg-night text-cream font-black text-[12.5px]">今夜の睡眠を記録しにいく</button>
                                </div>
                                <div className="text-[10px] font-bold text-[#B9B2A6] text-center">スコアは査読付き学術論文の基準にもとづいて算出しています</div>
                            </React.Fragment>
                        )}
                    </div>
                </Sheet>
            );
        };

        // ============================================================
        // 来店モード(添付導線の14ステップをそのまま体験)
        // ============================================================
        const VisitFlowSheet = ({ onClose }) => {
            const { state, update, addXp } = useApp();
            const appLink = useAppLink();
            const flow = state.visitFlow;
            const [celebrate, setCelebrate] = useState(false);

            const start = () => {
                hapticTap();
                update(s => { s.visitFlow = { date: todayYMD(), step: 0 }; return s; });
            };
            const nextStep = () => {
                hapticTap();
                if (flow.step + 1 >= VISIT_FLOW_STEPS.length) {
                    // 来店完了!
                    hapticYay();
                    update(s => {
                        s.visits = [...s.visits, { date: todayYMD(), menu: '睡眠整体コース', note: '来店フロー14ステップを完了' }];
                        if (s.tickets.balance > 0) {
                            s.tickets.balance -= 1;
                            s.tickets.history = [...s.tickets.history, { date: todayYMD(), delta: -1, note: '施術で利用' }];
                        }
                        s.visitFlow = null;
                        return s;
                    });
                    setTimeout(() => addXp('visit', 'サロンに来店'), 500);
                    setCelebrate(true);
                } else {
                    update(s => { s.visitFlow = { ...s.visitFlow, step: s.visitFlow.step + 1 }; return s; });
                }
            };
            const quit = () => {
                if (confirm('来店モードを終了しますか?(進行状況はリセットされます)')) {
                    update(s => { s.visitFlow = null; return s; });
                }
            };

            if (celebrate) {
                return (
                    <Sheet title="本日もありがとうございました" onClose={onClose} tone="night">
                        <div className="p-6 text-center relative">
                            <StarrySky density={26} />
                            <div className="relative">
                                <div className="mx-auto w-fit anim-pop"><SupiChan size={170} mood="wow" stageIdx={2} /></div>
                                <div className="text-star font-black text-[18px] mt-3">来店完了!おつかれさまでした🎉</div>
                                <div className="text-cream/75 text-[12px] font-bold mt-2 leading-relaxed">
                                    +120XP ゲット!回数券を1回分利用しました<br/>(のこり {state.tickets.balance}回)
                                </div>
                                <div className="mt-4 p-4 rounded-2xl bg-white/8 text-left" style={{ background: 'rgba(255,255,255,.08)' }}>
                                    <div className="text-star text-[11.5px] font-black mb-1.5">🏠 きょうから自宅でやること</div>
                                    <ul className="space-y-1 text-cream/80 text-[11.5px] font-bold">
                                        <li>・今夜の睡眠を記録する(施術後の変化を見よう)</li>
                                        <li>・提案されたストレッチを寝る前に1つ</li>
                                        <li>・ホームケア商品が届いたら今夜から使ってみる</li>
                                    </ul>
                                </div>
                                <button onClick={onClose} className="btn-press w-full mt-5 py-3.5 rounded-2xl bg-moon text-night font-black text-[14px]">アプリにもどる</button>
                            </div>
                        </div>
                    </Sheet>
                );
            }

            if (!flow) {
                return (
                    <Sheet title="来店モード — ご来店の流れ" onClose={onClose} wide>
                        <div className="p-5 pb-8">
                            <div className="rounded-3xl p-5 text-center relative overflow-hidden" style={{ background: 'linear-gradient(150deg,#101A2E,#22335A)' }}>
                                <StarrySky density={14} shooting={false} />
                                <div className="relative">
                                    <SupiChan size={100} mood="happy" stageIdx={1} className="mx-auto" showZzz={false} />
                                    <div className="text-cream font-black text-[15px] mt-1">ようこそ、SLEEPYへ</div>
                                    <div className="text-cream/65 text-[11.5px] font-bold mt-1 leading-relaxed">来店から退店まで、14のステップで<br/>「眠りを整える体験」をご案内します</div>
                                </div>
                            </div>
                            <div className="mt-4 grid grid-cols-1 gap-1.5">
                                {VISIT_FLOW_STEPS.map(s => (
                                    <div key={s.n} className="flex items-center gap-3 px-3 py-2 rounded-xl bg-white border border-[#F0EBE1]">
                                        <span className="w-6 h-6 rounded-full bg-night text-cream text-[10.5px] font-black flex items-center justify-center flex-shrink-0">{s.n}</span>
                                        <span className="text-base">{s.icon}</span>
                                        <span className="text-[12px] font-black text-[#4A453C] flex-1">{s.title}</span>
                                        <span className="text-[9.5px] font-bold text-[#B9B2A6]">{s.place}</span>
                                    </div>
                                ))}
                            </div>
                            <button onClick={start} className="btn-press w-full mt-4 py-4 rounded-2xl text-cream font-black text-[14.5px] shadow-lg" style={{ background: 'linear-gradient(135deg,#22335A,#101A2E)' }}>🏪 来店モードをはじめる</button>
                            <div className="mt-2 text-[10.5px] font-bold text-[#B9B2A6] text-center">ご来店時にスタッフと一緒に進めていきます</div>
                        </div>
                    </Sheet>
                );
            }

            const step = VISIT_FLOW_STEPS[flow.step];
            return (
                <Sheet title={`来店モード — ステップ ${step.n}/14`} onClose={onClose} wide>
                    <div className="p-5 pb-8">
                        {/* 進行バー */}
                        <div className="flex items-center gap-1">
                            {VISIT_FLOW_STEPS.map((s, i) => (
                                <div key={s.n} className="flex-1 h-1.5 rounded-full transition-all duration-500" style={{ background: i < flow.step ? '#5FBF97' : i === flow.step ? '#F6CE6E' : '#EFEAE0' }} />
                            ))}
                        </div>
                        <div className="mt-1.5 flex justify-between text-[9.5px] font-bold text-[#B9B2A6]"><span>来店</span><span>施術</span><span>退店</span></div>

                        <div className="mt-4 card p-5 anim-pop text-center">
                            <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#FAF7F0] text-[10px] font-black text-[#8B857A]">📍 {step.place}</div>
                            <div className="text-[46px] mt-2">{step.icon}</div>
                            <div className="font-black text-[18px] mt-1">{step.n}. {step.title}</div>
                            <p className="mt-2 text-[12.5px] font-bold text-[#6B655B] leading-relaxed">{step.desc}</p>
                            {step.appLink && (
                                <button onClick={() => appLink(step.appLink)} className="btn-press mt-4 w-full py-3 rounded-2xl bg-lav-pale border border-lav/40 text-lav-deep font-black text-[13px]">
                                    📲 {step.appLabel}
                                </button>
                            )}
                            <button onClick={nextStep} className="btn-press mt-2.5 w-full py-3.5 rounded-2xl text-cream font-black text-[14px] shadow-lg" style={{ background: 'linear-gradient(135deg,#5FBF97,#3E8B69)' }}>
                                {flow.step + 1 >= VISIT_FLOW_STEPS.length ? '🎉 すべて完了して退店する' : '✓ このステップを完了'}
                            </button>
                        </div>

                        {/* つぎのステップ予告 */}
                        {flow.step + 1 < VISIT_FLOW_STEPS.length && (
                            <div className="mt-3 flex items-center gap-2.5 px-4 py-3 rounded-2xl bg-[#FAF7F0] border border-[#EFEAE0]">
                                <span className="text-[10px] font-black text-[#B9B2A6] flex-shrink-0">つぎは</span>
                                <span className="text-base">{VISIT_FLOW_STEPS[flow.step + 1].icon}</span>
                                <span className="text-[12px] font-black text-[#6B655B]">{VISIT_FLOW_STEPS[flow.step + 1].n}. {VISIT_FLOW_STEPS[flow.step + 1].title}</span>
                            </div>
                        )}
                        <button onClick={quit} className="w-full mt-3 py-2 text-[11px] font-black text-[#B9B2A6]">来店モードを終了する</button>
                    </div>
                </Sheet>
            );
        };

        // ============================================================
        // シートルーター / ボトムナビ / アプリ本体
        // ============================================================
        const SheetRouter = () => {
            const { sheet, closeSheet } = useUI();
            if (!sheet) return null;
            const { name, param } = sheet;
            if (name === 'diagSimple') return <DiagSimpleSheet onClose={closeSheet} />;
            if (name === 'diagFull') return <DiagFullSheet onClose={closeSheet} />;
            if (name === 'diagResult') return <DiagResultSheet onClose={closeSheet} />;
            if (name === 'article') return <ArticleSheet articleId={param} onClose={closeSheet} />;
            if (name === 'stretch') return <StretchSheet stretchId={param} onClose={closeSheet} />;
            if (name === 'product') return <ProductSheet productId={param} onClose={closeSheet} />;
            if (name === 'cart') return <CartSheet onClose={closeSheet} />;
            if (name === 'posture') return <PostureSheet onClose={closeSheet} />;
            if (name === 'postureReport') return <PostureReportSheet onClose={closeSheet} />;
            if (name === 'visitFlow') return <VisitFlowSheet onClose={closeSheet} />;
            if (name === 'logDetail') return <LogDetailSheet ymd={param} onClose={closeSheet} />;
            return null;
        };

        const NAV_TABS = [
            { key:'home', icon:'🏠', label:'ホーム' },
            { key:'sleep', icon:'🌙', label:'すいみん' },
            { key:'learn', icon:'📚', label:'まなぶ' },
            { key:'care', icon:'🧘', label:'ケア' },
            { key:'shop', icon:'🛒', label:'ストア' },
            { key:'mypage', icon:'🐑', label:'マイ' },
        ];
        const BottomNav = () => {
            const { tab, setTab } = useUI();
            const { state } = useApp();
            const missions = useMissions();
            const missionsLeft = missions.filter(m => !m.done).length;
            return (
                <nav className="fixed bottom-0 inset-x-0 z-50" style={{ background: 'rgba(255,252,245,.92)', backdropFilter: 'blur(12px)', borderTop: '1px solid #EFEAE0', paddingBottom: 'env(safe-area-inset-bottom)' }}>
                    <div className="max-w-lg mx-auto flex">
                        {NAV_TABS.map(t => {
                            const active = tab === t.key;
                            return (
                                <button key={t.key} onClick={() => setTab(t.key)} className="flex-1 py-2 flex flex-col items-center gap-0.5 relative" aria-label={t.label}>
                                    <span className={`w-11 h-7 rounded-full flex items-center justify-center text-[17px] transition-all duration-200 ${active ? 'bg-night' : ''}`} style={{ filter: active ? 'none' : 'grayscale(.4) opacity(.75)' }}>{t.icon}</span>
                                    <span className={`text-[9px] font-black ${active ? 'text-night' : 'text-[#B9B2A6]'}`}>{t.label}</span>
                                    {t.key === 'home' && missionsLeft > 0 && !active && <span className="absolute top-1 right-1/2 translate-x-4 w-4 h-4 rounded-full bg-blush text-white text-[8.5px] font-black flex items-center justify-center">{missionsLeft}</span>}
                                    {t.key === 'shop' && cartCount(state.cart) > 0 && <span className="absolute top-1 right-1/2 translate-x-4 w-4 h-4 rounded-full bg-moon text-night text-[8.5px] font-black flex items-center justify-center">{cartCount(state.cart)}</span>}
                                </button>
                            );
                        })}
                    </div>
                </nav>
            );
        };

        const Splash = ({ done }) => (
            <div className={`fixed inset-0 z-[2000] flex flex-col items-center justify-center transition-opacity duration-700 ${done ? 'opacity-0 pointer-events-none' : ''}`} style={{ background: '#131C2E' }}>
                <StarrySky density={30} />
                <img src="assets/sleepy-logo.jpg" alt="睡眠整体サロン SLEEPY" className="relative w-56 max-w-[62vw] rounded-[28px] shadow-2xl anim-pop"
                     onError={(e) => { e.target.style.display = 'none'; }} />
                <div className="relative mt-5 text-cream/70 text-[11px] font-bold tracking-widest" style={{ animation: 'fade-in 1s ease .3s both' }}>スーピーくんを起こしています…</div>
            </div>
        );

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { err: null }; }
            static getDerivedStateFromError(err) { return { err }; }
            componentDidCatch(err, info) { console.error('App error:', err, info); }
            render() {
                if (this.state.err) {
                    return (
                        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12, padding: 24, textAlign: 'center' }}>
                            <div style={{ fontSize: 40 }}>🐑💦</div>
                            <div style={{ fontWeight: 900 }}>ごめんなさい、エラーが起きました</div>
                            <div style={{ fontSize: 12, color: '#8B857A', fontWeight: 700 }}>{String(this.state.err && this.state.err.message || this.state.err)}</div>
                            <button onClick={() => { localStorage.removeItem(LS_KEY); location.reload(); }} style={{ padding: '10px 22px', borderRadius: 999, background: '#101A2E', color: '#FFF8EC', fontWeight: 900, border: 'none' }}>データをリセットして再起動</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const Main = () => {
            const { tab } = useUI();
            return (
                <div className="min-h-screen" style={{ background: '#F4F1EA' }}>
                    {tab === 'home' && <HomeView />}
                    {tab === 'sleep' && <SleepView />}
                    {tab === 'learn' && <LearnView />}
                    {tab === 'care' && <CareView />}
                    {tab === 'shop' && <ShopView />}
                    {tab === 'mypage' && <MyPageView />}
                    <SheetRouter />
                    <LevelUpFx />
                    <BottomNav />
                </div>
            );
        };

        const App = () => {
            const [splashDone, setSplashDone] = useState(false);
            useEffect(() => { const t = setTimeout(() => setSplashDone(true), 1500); return () => clearTimeout(t); }, []);
            return (
                <ErrorBoundary>
                    <AppProvider>
                        <UIProvider>
                            <Splash done={splashDone} />
                            <Main />
                        </UIProvider>
                    </AppProvider>
                </ErrorBoundary>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
