    <!-- ============================================================
         睡眠整体サロン SLEEPY — 顧客向けアプリ「スーピーくんと眠ろう」
         ------------------------------------------------------------
         このHTMLファイル1枚をブラウザで開くだけで動作する
         スタンドアロン構成(要インターネット接続: CDN/カメラAI読込)。
         データはすべてブラウザ内 localStorage に保存されます。

         ▼ 機能マップ(来店前 → 来店中 → 来店後の14ステップ導線に対応)
           1  来店前AI診断(かんたん8問)        → 「睡眠」タブ
           2  来店・本診断(30問AI徹底分析)      → 「睡眠」タブ
           3  教育動画・記事                    → 「学ぶ」タブ
           4  カウンセリング(診断レポート共有)  → 診断結果画面
           5  体験(施術前)                     → 来店モード
           6  施術                             → 来店モード
           7  効果の可視化(姿勢Before/After)    → 「ケア」タブ内 姿勢分析
           8  AI再評価・レポート                → 姿勢分析 比較レポート
           9  最優先ホームケア決定(1〜3点提案)  → 「ケア」タブ
           10 商品体験・提案                    → 「ショップ」タブ
           11 プラン・サブスク案内              → 「ショップ」タブ
           12 EC登録・その場で購入              → 「ショップ」タブ
           13 自宅で継続・アプリ連携            → 睡眠記録・ミッション
           14 データ蓄積・レベルUP              → スーピーくん育成
         ============================================================ -->

    <div id="root">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#101A2E;color:#FFF8EC;font-weight:700;gap:14px;">

    <div id="sleepy-toast-root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useRef, useCallback, useMemo, useContext, createContext } = React;

        // ============================================================
        // ユーティリティ
        // ============================================================
        const todayYMD = (d = new Date()) => {
            const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
            return `${y}-${m}-${day}`;
        };
        const ymdAddDays = (ymd, n) => { const d = new Date(ymd + 'T12:00:00'); d.setDate(d.getDate()+n); return todayYMD(d); };
        const fmtMD = (ymd) => { if(!ymd) return ''; const [,m,d] = ymd.split('-'); return `${Number(m)}/${Number(d)}`; };
        const fmtJP = (ymd) => { if(!ymd) return ''; const [y,m,d] = ymd.split('-'); const w = '日月火水木金土'[new Date(ymd+'T12:00:00').getDay()]; return `${y}年${Number(m)}月${Number(d)}日(${w})`; };
        const yen = (n) => '¥' + Number(n).toLocaleString('ja-JP');
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
        const uid = () => 'id' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

        const prefersReducedMotion = typeof window !== 'undefined' && window.matchMedia
            ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
        const hapticOk = () => (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function' && !prefersReducedMotion);
        const hapticTap = () => { if (hapticOk()) { try { navigator.vibrate(10); } catch(_){} } };
        const hapticYay = () => { if (hapticOk()) { try { navigator.vibrate([8,30,8,30,16]); } catch(_){} } };

        const showToast = (message, type = 'info', duration = 3000) => {
            const bg = { success:'#5FBF97', error:'#E24B4A', info:'#3D4E79', warning:'#E8A03C', xp:'#7B6BC4' }[type] || '#3D4E79';
            const icon = { success:'✓', error:'!', info:'☾', warning:'⚠', xp:'★' }[type] || '☾';
            const root = document.getElementById('sleepy-toast-root');
            if (!root) return;
            const el = document.createElement('div');
            el.className = 'sleepy-toast';
            el.style.background = bg;
            el.innerHTML = `<span style="font-size:15px;">${icon}</span><span>${message}</span>`;
            root.appendChild(el);
            setTimeout(() => {
                el.style.transition = 'opacity .3s ease, transform .3s ease';
                el.style.opacity = '0'; el.style.transform = 'translateY(-8px)';
                setTimeout(() => el.remove(), 320);
            }, duration);
        };

        // ============================================================
        // マスタデータ ①: スーピーくん育成
        // ============================================================
        // XPとレベル: level = 必要XPが徐々に増える曲線
        const levelFromXp = (xp) => { let lv = 1; while (lv < 40 && xp >= xpForLevel(lv + 1)) lv++; return lv; };
        const xpForLevel = (lv) => Math.round(40 * (lv - 1) * (lv + 4));  // Lv2=240, Lv5=576... 累積必要XP
        const xpProgress = (xp) => {
            const lv = levelFromXp(xp);
            const cur = xpForLevel(lv), next = xpForLevel(lv + 1);
            return { lv, cur, next, pct: clamp(Math.round(((xp - cur) / (next - cur)) * 100), 0, 100), need: next - xp };
        };
        const SUPI_STAGES = [
            { min: 1,  name: 'ねむりのたまご',     desc: 'スーピーくんはまだ夢のなか。記録をつけて起こしてあげよう' },
            { min: 4,  name: 'うとうとスーピー',   desc: 'すこし目を覚ましはじめた。毎日の睡眠記録がうれしいみたい' },

            { min: 13, name: 'ぐっすりスーピー',   desc: '星のマフラーを巻いてごきげん。深い眠りが増えてきた証拠' },
            { min: 19, name: 'ドリームスーピー',   desc: '雲のうえでおひるね。眠りの上級者に近づいてきた' },
            { min: 26, name: 'ねむりマスター',     desc: '金の王冠が輝く、眠りの達人。このリズムを守っていこう' },
        ];
        const supiStage = (lv) => { let s = SUPI_STAGES[0]; for (const st of SUPI_STAGES) if (lv >= st.min) s = st; return s; };
        const XP_RULES = [
            { key:'sleepLog',  label:'睡眠を記録する',            xp: 12 },
            { key:'goodSleep', label:'睡眠スコア80以上',          xp: 18 },
            { key:'learn',     label:'教育コンテンツを読む',      xp: 15 },
            { key:'quiz',      label:'クイズに正解する',          xp: 8 },
            { key:'stretch',   label:'ストレッチを実施する',      xp: 20 },
            { key:'posture',   label:'姿勢分析をする',            xp: 30 },

                    '大切なのは「長さ」だけでなく「深さ」。同じ7時間でも、深い眠りに入れた日とそうでない日では回復力がまったく違います。そして深さを決めているのが、日中の行動と自律神経のバランスなのです。',
                    'SLEEPYの施術とこのアプリは、あなたの毎日の行動を少しずつ「眠れる体」に近づけるための道具です。まずは今夜の睡眠を記録するところから始めましょう。',
                ],
                points: ['睡眠中は体と脳の「修復工事」の時間', '「長さ」より「深さ」が回復力を決める', '深さは日中の行動と自律神経で決まる'],
                quiz: { q: '睡眠の回復力を決めるうえで、時間の長さとともに大切なものは?', choices: ['眠りの深さ', '布団の値段', '夢の内容'], answer: 0, exp: '同じ睡眠時間でも「深さ」で回復力は大きく変わります。深さは日中の過ごし方で育てられます。' },

            st.quizDone = ['edu1'];
            // --- ストレッチ実施履歴 ---
            st.stretchLog[ymdAddDays(todayYMD(), -2)] = ['st2'];
            st.stretchLog[ymdAddDays(todayYMD(), -1)] = ['st2', 'st1'];
            // --- 姿勢分析(2回目来店時のBefore/After・デモ値) ---
            st.postures = [
                { id: uid(), date: secondVisit, phase: 'before', view: 'side', total: 58, demo: true,
                  items: [ { key:'head', label:'頭部前方偏位(CVA)', score: 46, value:'推定CVA 48°' }, { key:'shoulder', label:'巻き肩・猫背', score: 55, value:'152°' }, { key:'hip', label:'骨盤の前後傾斜', score: 68, value:'165°' }, { key:'knee', label:'膝の過伸展', score: 82, value:'176°' } ] },
                { id: uid(), date: secondVisit, phase: 'after', view: 'side', total: 78, demo: true,
                  items: [ { key:'head', label:'頭部前方偏位(CVA)', score: 74, value:'推定CVA 54°' }, { key:'shoulder', label:'巻き肩・猫背', score: 76, value:'159°' }, { key:'hip', label:'骨盤の前後傾斜', score: 80, value:'168°' }, { key:'knee', label:'膝の過伸展', score: 84, value:'176°' } ] },
            ];
            // --- XP(これまでの活動ぶん) → Lv8「すやすやスーピー」 ---
            st.xp = 3500;
            st.xpLog = [{ date: todayYMD(), key: 'seed', xp: 3500, note: 'これまでの活動' }];
            return st;
        };
        const loadState = () => {
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (raw) { const parsed = JSON.parse(raw); return { ...defaultState(), ...parsed }; }
            } catch (e) { console.warn('state load failed', e); }
            return seedDemo();
        };

        const AppCtx = createContext(null);
        const useApp = () => useContext(AppCtx);

        const AppProvider = ({ children }) => {
            const [state, setState] = useState(loadState);
            const [fx, setFx] = useState(null); // レベルアップ演出など
            useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }, [state]);

            const update = useCallback((fn) => setState(prev => fn(structuredClone(prev))), []);

            const addXp = useCallback((key, note) => {
                const rule = XP_RULES.find(r => r.key === key);
                const amount = rule ? rule.xp : 10;
                setState(prev => {
                    const before = levelFromXp(prev.xp);
                    const xp = prev.xp + amount;
                    const after = levelFromXp(xp);
                    const next = { ...prev, xp, xpLog: [...prev.xpLog, { date: todayYMD(), key, xp: amount, note: note || (rule ? rule.label : '') }] };
                    setTimeout(() => {
                        showToast(`+${amount} XP ${note || (rule ? rule.label : '')}`, 'xp', 2200);
                        if (after > before) {
                            hapticYay();
                            setFx({ type: 'levelup', lv: after });
                        }
                    }, 60);
                    return next;
                });
            }, []);

            const value = useMemo(() => ({ state, setState, update, addXp, fx, setFx }), [state, update, addXp, fx]);
            return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
        };

        // ============================================================
        // スーピーくん(ロゴ準拠のアニメーションSVG)
        // ============================================================
        // 毛のモコモコを2パスで描く(1パス目:輪郭つき / 2パス目:内側の線消し)
        const WoolCluster = ({ circles, fill = '#FDF6E8', stroke = '#7A5238', sw = 5 }) => (
            <g>
                {circles.map((c, i) => <circle key={'o'+i} cx={c[0]} cy={c[1]} r={c[2]} fill={fill} stroke={stroke} strokeWidth={sw} />)}
                {circles.map((c, i) => <circle key={'f'+i} cx={c[0]} cy={c[1]} r={Math.max(1, c[2] - sw/2 + 0.6)} fill={fill} />)}
            </g>
        );

        const SupiChan = ({ size = 200, mood = 'sleep', stageIdx = 0, animate = true, className = '', showZzz = true }) => {
            // mood: 'sleep' | 'happy' | 'wow' | 'tired'
            const headWool = [ [78,74,21],[97,62,23],[118,60,23],[137,68,21],[151,84,17],[66,90,16],[159,101,13] ];
            const bodyWool = [ [110,158,34],[74,146,24],[146,146,24],[62,170,19],[158,170,19],[82,186,21],[138,186,21],[110,192,23] ];
            const eyeColor = '#6B4A32';
            const zzz = showZzz && (mood === 'sleep' || mood === 'tired');
            return (
                <svg viewBox="0 0 220 232" width={size} height={size * 232/220} className={className} style={{ overflow:'visible' }}>
                    {/* ステージ4+: 雲の座布団 */}
                    {stageIdx >= 4 && (
                        <g opacity="0.95">
                            <ellipse cx="110" cy="219" rx="78" ry="14" fill="#DCE9F8" />
                            <ellipse cx="58" cy="215" rx="24" ry="11" fill="#EAF2FB" />
                            <ellipse cx="162" cy="215" rx="24" ry="11" fill="#EAF2FB" />
                            <ellipse cx="110" cy="212" rx="34" ry="12" fill="#F3F8FD" />
                        </g>
                    )}
                    <g className={animate ? 'supi-breathe' : ''}>
                        {/* 耳 */}
                        <g>
                            <ellipse cx="63" cy="112" rx="17" ry="10" transform="rotate(-32 63 112)" fill="#B0805A" stroke="#7A5238" strokeWidth="4.5" />
                            <ellipse cx="157" cy="112" rx="17" ry="10" transform="rotate(32 157 112)" fill="#B0805A" stroke="#7A5238" strokeWidth="4.5" />
                        </g>
                        {/* 後ろ足 */}
                        <ellipse cx="82" cy="205" rx="15" ry="10" fill="#8B6244" stroke="#7A5238" strokeWidth="4" />
                        <ellipse cx="138" cy="205" rx="15" ry="10" fill="#8B6244" stroke="#7A5238" strokeWidth="4" />
                        {/* 体の毛 */}
                        <WoolCluster circles={bodyWool} />
                        {/* 前あし(蹄) */}
                        <g>
                            <ellipse cx="90" cy="160" rx="13" ry="9" transform="rotate(24 90 160)" fill="#C58F63" stroke="#7A5238" strokeWidth="4" />
                            <path d="M84,156 q4,3 3,8" fill="none" stroke="#7A5238" strokeWidth="2.5" strokeLinecap="round" />
                            <ellipse cx="130" cy="160" rx="13" ry="9" transform="rotate(-24 130 160)" fill="#C58F63" stroke="#7A5238" strokeWidth="4" />
                            <path d="M136,156 q-4,3 -3,8" fill="none" stroke="#7A5238" strokeWidth="2.5" strokeLinecap="round" />
                        </g>
                        {/* 顔 */}
                        <ellipse cx="110" cy="103" rx="31" ry="28" fill="#F6D9A8" stroke="#7A5238" strokeWidth="4.5" />
                        {/* 頭の毛 */}
                        <WoolCluster circles={headWool} />
                        {/* 三日月(ロゴのアイデンティティ) */}
                        <g className="moon-glow" style={{ animation: animate ? 'moon-glow 3s ease-in-out infinite' : 'none' }}>
                            <path d="M104,40 a13,13 0 1,0 14,20 a10.5,10.5 0 1,1 -14,-20 Z" fill="#F6CE6E" transform={stageIdx >= 2 ? 'translate(-16,6) rotate(-10 104 50)' : ''} />
                        </g>
                        {/* ステージ2+: ナイトキャップ */}
                        {stageIdx >= 2 && (
                            <g>
                                <path d="M104,52 Q126,18 172,30 Q178,34 174,42 Q160,40 148,50 Q128,40 110,58 Z" fill="#9D8FD8" stroke="#7A5238" strokeWidth="4" strokeLinejoin="round" />
                                <path d="M120,44 l2.6,5.4 6,.6 -4.5,4 1.3,5.9 -5.4,-3 -5.4,3 1.3,-5.9 -4.5,-4 6,-.6 Z" fill="#FFE9A8" transform="scale(.7) translate(53,20)" />
                                <circle cx="176" cy="38" r="7.5" fill="#FFF8EC" stroke="#7A5238" strokeWidth="3.5" />
                            </g>
                        )}
                        {/* ステージ5+: 王冠 */}
                        {stageIdx >= 5 && (
                            <g transform="translate(60,30) rotate(-14)">
                                <path d="M0,16 L4,2 L11,12 L17,0 L23,12 L30,2 L34,16 Q17,21 0,16 Z" fill="#F6C445" stroke="#B98A1E" strokeWidth="2.5" strokeLinejoin="round" />
                                <circle cx="17" cy="8" r="2.2" fill="#E2564B" />
                            </g>
                        )}
                        {/* 目・口(mood別) */}
                        {mood === 'happy' ? (
                            <g>
                                <path d="M88,102 Q95,95 102,102" fill="none" stroke={eyeColor} strokeWidth="4" strokeLinecap="round" />
                                <path d="M118,102 Q125,95 132,102" fill="none" stroke={eyeColor} strokeWidth="4" strokeLinecap="round" />
                                <path d="M103,113 Q110,121 117,113" fill="none" stroke={eyeColor} strokeWidth="3.5" strokeLinecap="round" />
                            </g>
                        ) : mood === 'wow' ? (
                            <g>
                                <path d="M95,96 l2.2,4.6 5,.5 -3.7,3.4 1,5 -4.5,-2.6 -4.5,2.6 1,-5 -3.7,-3.4 5,-.5 Z" fill="#F6B93B" stroke="#D9931F" strokeWidth="1" />
                                <path d="M125,96 l2.2,4.6 5,.5 -3.7,3.4 1,5 -4.5,-2.6 -4.5,2.6 1,-5 -3.7,-3.4 5,-.5 Z" fill="#F6B93B" stroke="#D9931F" strokeWidth="1" />
                                <ellipse cx="110" cy="115" rx="4.5" ry="5.5" fill={eyeColor} />
                            </g>
                        ) : mood === 'tired' ? (
                            <g>
                                <path d="M88,103 Q95,107 102,103" fill="none" stroke={eyeColor} strokeWidth="4" strokeLinecap="round" />
                                <path d="M118,103 Q125,107 132,103" fill="none" stroke={eyeColor} strokeWidth="4" strokeLinecap="round" />
                                <path d="M88,109 Q95,112 102,109" fill="none" stroke="#C9A574" strokeWidth="2.5" strokeLinecap="round" />
                                <path d="M118,109 Q125,112 132,109" fill="none" stroke="#C9A574" strokeWidth="2.5" strokeLinecap="round" />
                                <path d="M104,116 Q110,113 116,116" fill="none" stroke={eyeColor} strokeWidth="3.5" strokeLinecap="round" />
                                <path d="M143,88 q6,2 4,9 q-2,6 -8,4" fill="#BFE0F5" opacity="0.9" />
                            </g>
                        ) : (
                            <g>
                                <path d="M88,101 Q95,109 102,101" fill="none" stroke={eyeColor} strokeWidth="4" strokeLinecap="round" />
                                <path d="M118,101 Q125,109 132,101" fill="none" stroke={eyeColor} strokeWidth="4" strokeLinecap="round" />
                                <circle cx="110" cy="111" r="2" fill={eyeColor} />
                                <path d="M102,115 q4,4.5 8,0 M110,115 q4,4.5 8,0" fill="none" stroke={eyeColor} strokeWidth="3" strokeLinecap="round" />
                            </g>
                        )}
                        {/* 頬 */}
                        <circle cx="86" cy="112" r="6" fill="#F2A9A0" opacity="0.8" />
                        <circle cx="134" cy="112" r="6" fill="#F2A9A0" opacity="0.8" />
                        {/* ステージ3+: 星のマフラー */}
                        {stageIdx >= 3 && (
                            <g>
                                <path d="M83,132 Q110,148 137,132" fill="none" stroke="#9D8FD8" strokeWidth="11" strokeLinecap="round" opacity="0.9" />
                                {[[92,138],[110,142],[128,138]].map(([x,y],i) => (
                                    <path key={i} d={`M${x},${y-5} l1.8,3.7 4,.4 -3,2.7 .9,4 -3.7,-2.1 -3.7,2.1 .9,-4 -3,-2.7 4,-.4 Z`} fill="#FFE9A8" stroke="#E8B84B" strokeWidth="1" />
                                ))}
                            </g>
                        )}
                    </g>
                    {/* Zzz */}
                    {zzz && animate && (
                        <g fontFamily='"Zen Maru Gothic", sans-serif' fontWeight="900" fill={mood === 'tired' ? '#B9B2A6' : '#9D8FD8'}>
                            <text x="168" y="70" fontSize="17" style={{ animation: 'zzz-float 3s ease-in-out infinite' }}>z</text>
                            <text x="178" y="58" fontSize="22" style={{ animation: 'zzz-float 3s ease-in-out infinite 0.9s' }}>z</text>
                            <text x="190" y="44" fontSize="27" style={{ animation: 'zzz-float 3s ease-in-out infinite 1.8s' }}>Z</text>
                        </g>
                    )}
                </svg>
            );
        };

        // 夜空(星)背景
        const StarrySky = ({ density = 26, shooting = true }) => {
            const stars = useMemo(() => Array.from({ length: density }, (_, i) => ({
                x: Math.random() * 100, y: Math.random() * 100,
                r: Math.random() * 1.4 + 0.5, d: Math.random() * 3, big: Math.random() > 0.85,
            })), [density]);
            return (
                <svg className="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" aria-hidden="true">
                    {stars.map((s, i) => (
                        <circle key={'c'+i} cx={s.x + '%'} cy={s.y + '%'} r={s.r} fill="#FFE9A8"
                            style={{ animation: `star-twinkle ${2.4 + s.d}s ease-in-out ${s.d}s infinite` }} />
                    ))}
                    {shooting && <line x1="88%" y1="8%" x2="97%" y2="2%" stroke="#FFE9A8" strokeWidth="1.6" strokeLinecap="round" style={{ animation: 'shooting 7s ease-in 3s infinite' }} />}
                </svg>
            );
        };

        // ============================================================
        // 共通UIコンポーネント
        // ============================================================
        const ScoreRing = ({ score, size = 92, label, sub, trackColor = 'rgba(128,128,128,.14)' }) => {
            const col = scoreColor(score);
            const r = 40, C = 2 * Math.PI * r;
            return (
                <svg viewBox="0 0 100 100" width={size} height={size} className="flex-shrink-0">
                    <circle cx="50" cy="50" r={r} fill="none" stroke={trackColor} strokeWidth="9" />
                    <circle cx="50" cy="50" r={r} fill="none" stroke={col} strokeWidth="9" strokeLinecap="round"
                        strokeDasharray={C} strokeDashoffset={C * (1 - (score == null ? 0 : score) / 100)}
                        style={{ transform: 'rotate(-90deg)', transformOrigin: 'center', transition: 'stroke-dashoffset .8s cubic-bezier(.2,.8,.3,1)' }} />
                    <text x="50" y={sub || label ? 45 : 50} textAnchor="middle" dominantBaseline="central" style={{ fontSize: 27, fontWeight: 900, fill: col, fontFamily: '"Zen Maru Gothic",sans-serif' }}>{score == null ? '–' : score}</text>
                    {(sub || label) && <text x="50" y="66" textAnchor="middle" dominantBaseline="central" style={{ fontSize: 10.5, fontWeight: 700, fill: col }}>{sub || label}</text>}
                </svg>
            );
        };

        const WeekBars = ({ rows, height = 120, onPick }) => {
            // rows: [{ymd, score}] 古い→新しい
            const w = 100 / rows.length;
            return (
                <div>
                    <svg viewBox={`0 0 340 ${height}`} className="w-full" style={{ height }}>
                        {rows.map((r, i) => {
                            const x = (340 / rows.length) * i + (340 / rows.length) * 0.18;
                            const bw = (340 / rows.length) * 0.64;
                            const h = r.score == null ? 4 : Math.max(5, (r.score / 100) * (height - 34));
                            const y = height - 22 - h;
                            return (
                                <g key={r.ymd} onClick={() => onPick && onPick(r.ymd)} style={{ cursor: onPick ? 'pointer' : 'default' }}>
                                    <rect x={x} y={y} width={bw} height={h} rx={Math.min(7, bw/2)} fill={r.score == null ? '#E7E1D4' : scoreColor(r.score)} opacity={r.score == null ? 0.8 : 0.92} />
                                    {r.score != null && r.score >= 30 && <text x={x + bw/2} y={y - 5} textAnchor="middle" fontSize="10.5" fontWeight="700" fill="#8B857A">{r.score}</text>}
                                    <text x={x + bw/2} y={height - 8} textAnchor="middle" fontSize="10" fontWeight="700" fill={r.ymd === todayYMD() ? '#7B6BC4' : '#B9B2A6'}>{fmtMD(r.ymd)}</text>
                                </g>
                            );
                        })}
                    </svg>
                </div>
            );
        };

        const RadarChart = ({ scores, size = 230 }) => {
            // scores: {A,B,C,D} 0-100
            const keys = ['A','B','C','D'];
            const labels = { A:'睡眠の質', B:'生活リズム', C:'自律神経', D:'からだ' };
            const cx = 115, cy = 108, R = 72;
            const pt = (i, v) => {
                const ang = -Math.PI/2 + (Math.PI * 2 / 4) * i;
                return [cx + Math.cos(ang) * R * v / 100, cy + Math.sin(ang) * R * v / 100];
            };
            const poly = keys.map((k, i) => pt(i, scores[k]).join(',')).join(' ');
            return (
                <svg viewBox="0 0 230 216" width={size} className="mx-auto block">
                    {[25, 50, 75, 100].map(g => (
                        <polygon key={g} points={keys.map((k,i)=>pt(i,g).join(',')).join(' ')} fill={g===100?'rgba(157,143,216,.06)':'none'} stroke="#E7E1D4" strokeWidth="1.2" />
                    ))}
                    {keys.map((k, i) => { const [x,y] = pt(i, 100); return <line key={k} x1={cx} y1={cy} x2={x} y2={y} stroke="#E7E1D4" strokeWidth="1.2" />; })}
                    <polygon points={poly} fill="rgba(123,107,196,.28)" stroke="#7B6BC4" strokeWidth="2.5" strokeLinejoin="round" />
                    {keys.map((k, i) => { const [x,y] = pt(i, scores[k]); return <circle key={k} cx={x} cy={y} r="4" fill="#7B6BC4" stroke="#fff" strokeWidth="1.5" />; })}
                    {keys.map((k, i) => {
                        const [x,y] = pt(i, 132);
                        return (
                            <g key={'l'+k}>
                                <text x={x} y={y-6} textAnchor="middle" fontSize="11.5" fontWeight="800" fill="#6B655B">{labels[k]}</text>
                                <text x={x} y={y+8} textAnchor="middle" fontSize="12" fontWeight="900" fill={scoreColor(scores[k])}>{scores[k]}</text>
                            </g>
                        );
                    })}
                </svg>
            );
        };

        const Sheet = ({ title, onClose, children, tone = 'light', wide = false }) => {
            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => { document.body.style.overflow = ''; };
            }, []);
            return (
                <div className="fixed inset-0 z-[999] flex items-end md:items-center justify-center anim-fade" style={{ background: 'rgba(16,26,46,.55)', backdropFilter: 'blur(3px)' }} onClick={onClose}>
                    <div className={`sheet-in w-full ${wide ? 'md:max-w-3xl' : 'md:max-w-lg'} max-h-[94vh] md:max-h-[88vh] flex flex-col overflow-hidden ${tone === 'night' ? 'bg-night text-cream' : 'bg-[#FAF7F0]'} rounded-t-3xl md:rounded-3xl shadow-2xl`} onClick={e => e.stopPropagation()}>
                        <div className={`flex items-center justify-between px-5 pt-4 pb-3 flex-shrink-0 ${tone === 'night' ? '' : 'border-b border-[#EFEAE0]'}`}>
                            <div className="font-black text-[15px]">{title}</div>
                            <button onClick={onClose} className="w-9 h-9 rounded-full flex items-center justify-center btn-press" style={{ background: tone === 'night' ? 'rgba(255,255,255,.12)' : '#EFEAE0' }} aria-label="閉じる">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            </button>
                        </div>
                        <div className="overflow-y-auto flex-1 overscroll-contain">{children}</div>
                    </div>
                </div>
            );
        };

        const XpBar = ({ xp, dark = false }) => {
            const p = xpProgress(xp);
            return (
                <div>
                    <div className="flex items-center justify-between mb-1">
                        <span className={`text-[11px] font-black ${dark ? 'text-star' : 'text-lav-deep'}`}>Lv.{p.lv}</span>
                        <span className={`text-[10px] font-bold ${dark ? 'text-cream/60' : 'text-[#B9B2A6]'}`}>つぎのレベルまで {p.need} XP</span>
                    </div>
                    <div className="h-2.5 rounded-full overflow-hidden" style={{ background: dark ? 'rgba(255,255,255,.14)' : '#EFEAE0' }}>
                        <div className="h-full rounded-full transition-all duration-700" style={{ width: p.pct + '%', background: 'linear-gradient(90deg,#9D8FD8,#F6CE6E)' }} />
                    </div>
                </div>
            );
        };

        const LevelUpFx = () => {
            const { fx, setFx, state } = useApp();
            if (!fx || fx.type !== 'levelup') return null;
            const stage = supiStage(fx.lv);
            return (
                <div className="fixed inset-0 z-[1200] flex items-center justify-center anim-fade" style={{ background: 'rgba(16,26,46,.78)', backdropFilter: 'blur(4px)' }} onClick={() => setFx(null)}>
                    <div className="relative text-center px-8 py-10 anim-pop" onClick={e => e.stopPropagation()}>
                        <StarrySky density={30} shooting={false} />
                        <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-52 h-52 rounded-full border-4 border-star" style={{ animation: 'levelup-ring 1.2s ease-out infinite' }} />
                        <div className="relative">
                            <div className="text-star font-black tracking-widest text-sm mb-1">LEVEL UP!</div>
                            <div className="text-cream font-black text-3xl mb-4">Lv.{fx.lv}</div>
                            <div className="mx-auto w-fit"><SupiChan size={170} mood="wow" stageIdx={SUPI_STAGES.indexOf(stage)} /></div>
                            <div className="mt-4 text-star font-black">{stage.name}</div>
                            <div className="mt-1 text-cream/80 text-xs font-bold max-w-[240px] mx-auto leading-relaxed">{stage.desc}</div>
                            <button onClick={() => setFx(null)} className="mt-6 px-8 py-3 rounded-full bg-moon text-night font-black text-sm btn-press">やったね!</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================================
        // 画面遷移コンテキスト(タブ + シート)
        // ============================================================
        const UICtx = createContext(null);
        const useUI = () => useContext(UICtx);
        const UIProvider = ({ children }) => {
            const [tab, setTab] = useState('home');
            const [sheet, setSheet] = useState(null); // {name, param}
            const openSheet = useCallback((name, param) => { hapticTap(); setSheet({ name, param }); }, []);
            const closeSheet = useCallback(() => setSheet(null), []);
            const go = useCallback((t) => { hapticTap(); setSheet(null); setTab(t); window.scrollTo({ top: 0 }); }, []);
            const value = useMemo(() => ({ tab, setTab: go, sheet, openSheet, closeSheet }), [tab, go, sheet, openSheet, closeSheet]);
            return <UICtx.Provider value={value}>{children}</UICtx.Provider>;
        };
        // アプリ内リンク(来店フローなどから各機能へ)
        const useAppLink = () => {
            const { setTab, openSheet } = useUI();
            return useCallback((link) => {
                if (!link) return;
                if (link === 'home') setTab('home');
                else if (link === 'sleep') setTab('sleep');
                else if (link === 'learn') setTab('learn');
                else if (link === 'care') setTab('care');
                else if (link === 'shop') setTab('shop');
                else if (link === 'mypage') setTab('mypage');
                else if (link === 'diagSimple') openSheet('diagSimple');
                else if (link === 'diagFull') openSheet('diagFull');
                else if (link === 'diagResult') openSheet('diagResult');
                else if (link === 'posture') openSheet('posture');
                else if (link === 'postureReport') openSheet('postureReport');
                else if (link === 'subsc') { setTab('shop'); setTimeout(() => { const el = document.getElementById('subsc-anchor'); el && el.scrollIntoView({ behavior:'smooth' }); }, 120); }
                else if (link === 'visitFlow') openSheet('visitFlow');
            }, [setTab, openSheet]);
        };

        // ============================================================
        // 共通: 今日のミッション
        // ============================================================
        const useMissions = () => {
            const { state } = useApp();
            const t = todayYMD();
            return [
                { key:'record', icon:'🌙', label:'昨夜の睡眠を記録する', xp:12, done: !!state.sleepLogs[t], link:'sleep' },
                { key:'stretch', icon:'🧘', label:'ストレッチを1つやる', xp:20, done: (state.stretchLog[t] || []).length > 0, link:'care' },
                { key:'learn', icon:'📚', label:'眠りの知識を1つ学ぶ', xp:15, done: state.xpLog.some(l => l.date === t && (l.key === 'learn' || l.key === 'quiz')), link:'learn' },
            ];
        };
        const calcStreak = (state) => {
            let streak = 0; let d = todayYMD();
            if (!state.sleepLogs[d]) d = ymdAddDays(d, -1);
            while (state.sleepLogs[d]) { streak++; d = ymdAddDays(d, -1); }
            return streak;
        };
        const supiMoodOf = (state) => {
            const log = state.sleepLogs[todayYMD()] || state.sleepLogs[ymdAddDays(todayYMD(), -1)];
            if (!log) return 'sleep';
            return log.score >= 78 ? 'happy' : log.score >= 52 ? 'sleep' : 'tired';
        };
        const supiTalk = (state) => {
            const t = todayYMD();
            const today = state.sleepLogs[t];
            if (!today) return 'おはよう…すやぁ。昨日の眠り、おしえてほしいメェ🌙';
            if (today.score >= 85) return `スコア${today.score}!さいこうの眠りだったメェ✨ このリズム、たからものだよ`;
            if (today.score >= 70) return `スコア${today.score}、いいかんじメェ。今夜は湯船→ストレッチでもっと深く眠れそう`;
            if (today.score >= 50) return `スコア${today.score}…もうひといきメェ。「学ぶ」に眠りのヒントがあるよ`;
            return `スコア${today.score}…おつかれさま。今夜はぼくと4-7-8呼吸をやってみようメェ`;
        };

        // ============================================================
        // ホーム
        // ============================================================
        const HomeView = () => {
            const { state } = useApp();
            const { setTab, openSheet } = useUI();
            const [tapFx, setTapFx] = useState(0);
            const [talking, setTalking] = useState(false);
            const p = xpProgress(state.xp);
            const stage = supiStage(p.lv);
            const stageIdx = SUPI_STAGES.indexOf(stage);
            const missions = useMissions();
            const doneCount = missions.filter(m => m.done).length;
            const todayLog = state.sleepLogs[todayYMD()];
            const lastLog = todayLog || state.sleepLogs[ymdAddDays(todayYMD(), -1)];
            const streak = calcStreak(state);
            const mood = tapFx ? 'happy' : supiMoodOf(state);
            const lastVisit = state.visits.length ? state.visits[state.visits.length - 1].date : null;
            const nextVisitYmd = lastVisit ? ymdAddDays(lastVisit, 14) : null;
            const daysToVisit = nextVisitYmd ? Math.ceil((new Date(nextVisitYmd) - new Date(todayYMD())) / 86400000) : null;

            const tapSupi = () => {
                hapticTap();
                setTapFx(x => x + 1);
                setTalking(true);
                setTimeout(() => setTapFx(0), 900);
                setTimeout(() => setTalking(false), 3600);
            };

            return (
                <div className="pb-28">
                    {/* ヒーロー: 夜空とスーピーくん */}
                    <div className="relative overflow-hidden" style={{ background: 'linear-gradient(175deg,#0C1526 0%,#101A2E 45%,#22335A 100%)' }}>
                        <StarrySky density={30} />
                        <div className="relative max-w-lg mx-auto px-5 pt-6 pb-7">
                            <div className="flex items-center justify-between">
                                <div>
                                    <div className="text-cream/60 text-[10px] font-bold tracking-[.2em]">睡眠整体サロン</div>
                                    <div className="text-cream font-black text-xl tracking-wider" style={{ fontFamily: '"Zen Maru Gothic",sans-serif' }}>SLEEPY</div>
                                </div>
                                <button onClick={() => openSheet('visitFlow')} className="btn-press flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-moon text-night text-[11px] font-black shadow-lg shadow-moon/20">
                                    🏪 来店モード
                                </button>
                            </div>

                            <div className="mt-2 flex flex-col items-center">
                                {/* ふきだし */}
                                <div className={`relative max-w-[280px] bg-cream text-night text-[12px] font-bold rounded-2xl px-4 py-2.5 leading-relaxed transition-all duration-300 ${talking ? 'anim-pop' : ''}`}>
                                    {talking ? ['メェ〜!なでてくれてうれしいメェ🐑💕','ふわぁ…いっしょにお昼寝するメェ?','きょうもよく来てくれたメェ!'][tapFx % 3] : supiTalk(state)}
                                    <div className="absolute left-1/2 -bottom-1.5 -translate-x-1/2 w-3 h-3 bg-cream rotate-45" />
                                </div>
                                <button onClick={tapSupi} className={`mt-1 ${tapFx ? 'supi-bounce' : ''}`} style={{ background:'none', border:'none', cursor:'pointer' }} aria-label="スーピーくんをなでる">
                                    <SupiChan size={195} mood={mood} stageIdx={stageIdx} />
                                </button>
                                {tapFx > 0 && (
                                    <div className="pointer-events-none absolute" style={{ marginTop: 30 }}>
                                        {['💛','⭐','💜'].map((h, i) => (
                                            <span key={tapFx + '-' + i} className="absolute text-lg" style={{ left: (i-1) * 34, animation: `heart-up 1s ease-out ${i * .12}s both` }}>{h}</span>
                                        ))}
                                    </div>
                                )}
                                <div className="mt-1 flex items-center gap-2">
                                    <span className="px-2.5 py-1 rounded-full bg-lav/25 text-star text-[10px] font-black tracking-wide">{stage.name}</span>
                                    <span className="text-cream/60 text-[10px] font-bold">{state.supiName}</span>
                                </div>
                                <div className="w-full max-w-[280px] mt-3"><XpBar xp={state.xp} dark /></div>
                            </div>
                        </div>
                        <svg viewBox="0 0 400 22" className="block w-full" preserveAspectRatio="none" style={{ height: 22 }}><path d="M0,22 L0,10 Q100,-8 200,10 T400,10 L400,22 Z" fill="#F4F1EA" /></svg>
                    </div>

                    <div className="max-w-lg mx-auto px-4 -mt-1 space-y-4">
                        {/* 今日のミッション */}
                        <div className="card p-4 anim-fade-up">
                            <div className="flex items-center justify-between mb-3">
                                <div className="font-black text-[14px]">きょうのミッション</div>
                                <span className="text-[11px] font-black" style={{ color: doneCount === 3 ? '#5FBF97' : '#B9B2A6' }}>{doneCount}/3 クリア</span>
                            </div>
                            <div className="space-y-2">
                                {missions.map(m => (
                                    <button key={m.key} onClick={() => setTab(m.link)} className={`btn-press w-full flex items-center gap-3 p-3 rounded-2xl border text-left transition ${m.done ? 'bg-mint-pale border-mint/40' : 'bg-[#FAF7F0] border-[#EFEAE0]'}`}>
                                        <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-lg ${m.done ? 'bg-mint/20' : 'bg-white'}`}>{m.icon}</div>
                                        <div className="flex-1">
                                            <div className={`text-[12.5px] font-black ${m.done ? 'text-mint line-through decoration-2' : ''}`}>{m.label}</div>
                                            <div className="text-[10px] font-bold text-[#B9B2A6]">+{m.xp} XP</div>
                                        </div>
                                        {m.done ? (
                                            <div className="w-6 h-6 rounded-full bg-mint flex items-center justify-center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="4" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>
                                        ) : (
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B9B2A6" strokeWidth="3" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
                                        )}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 昨夜の睡眠 + 回数券 */}
                        <div className="grid grid-cols-2 gap-3">
                            <button onClick={() => setTab('sleep')} className="btn-press card p-4 text-left anim-fade-up">
                                <div className="text-[11px] font-black text-[#8B857A] mb-1">{todayLog ? '昨夜の睡眠' : lastLog ? '一昨夜の睡眠' : '睡眠スコア'}</div>
                                <div className="flex items-center justify-center py-1"><ScoreRing score={lastLog ? lastLog.score : null} size={86} sub={lastLog ? scoreWord(lastLog.score) : '未記録'} /></div>
                                <div className="text-center text-[10px] font-bold text-[#B9B2A6]">🔥 連続記録 {streak}日</div>
                            </button>
                            <button onClick={() => setTab('mypage')} className="btn-press card p-4 text-left anim-fade-up relative overflow-hidden">
                                <div className="text-[11px] font-black text-[#8B857A] mb-1">回数券のこり</div>
                                <div className="flex items-end justify-center gap-1 pt-4 pb-2">
                                    <span className="text-[44px] leading-none font-black text-lav-deep">{state.tickets.balance}</span>
                                    <span className="text-[13px] font-black text-[#8B857A] pb-1.5">回</span>
                                </div>
                                <div className="text-center text-[10px] font-bold text-[#B9B2A6]">🎫 タップで利用履歴</div>
                                {state.tickets.balance <= 2 && <div className="absolute top-2 right-2 px-2 py-0.5 rounded-full bg-blush/20 text-[#D06A5F] text-[9px] font-black">のこりわずか</div>}
                            </button>
                        </div>

                        {/* 次回来店 */}
                        <div className="card p-4 anim-fade-up">
                            <div className="flex items-center gap-3.5">
                                <div className="w-11 h-11 rounded-2xl bg-lav-pale flex items-center justify-center text-xl">📅</div>
                                <div className="flex-1">
                                    <div className="text-[13px] font-black">つぎの来店めやす</div>
                                    {nextVisitYmd ? (
                                        <div className="text-[11px] font-bold text-[#8B857A] mt-0.5">
                                            {fmtJP(nextVisitYmd)}ごろ{daysToVisit != null && daysToVisit >= 0 ? `(あと${daysToVisit}日)` : '(そろそろです!)'}
                                        </div>
                                    ) : (
                                        <div className="text-[11px] font-bold text-[#8B857A] mt-0.5">はじめての方は「来店モード」からどうぞ</div>
                                    )}
                                    {state.diagFull && <div className="text-[10px] font-bold text-lav-deep mt-0.5">おすすめペース: {DIAG_TYPES[state.diagFull.typeKey].visit}</div>}
                                </div>
                                <button onClick={() => openSheet('visitFlow')} className="btn-press px-3.5 py-2 rounded-full bg-night text-cream text-[11px] font-black flex-shrink-0">来店の流れ</button>
                            </div>
                        </div>

                        {/* ショートカット */}
                        <div className="grid grid-cols-4 gap-2.5 anim-fade-up">
                            {[
                                { icon:'🩻', label:'姿勢分析', act: () => openSheet('posture') },
                                { icon:'🧠', label:'AI診断', act: () => setTab('sleep') },
                                { icon:'🧘', label:'ストレッチ', act: () => setTab('care') },
                                { icon:'🛒', label:'ショップ', act: () => setTab('shop') },
                            ].map(s => (
                                <button key={s.label} onClick={s.act} className="btn-press card px-1 py-3 flex flex-col items-center gap-1.5">
                                    <span className="text-[22px]">{s.icon}</span>
                                    <span className="text-[10px] font-black text-[#6B655B]">{s.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* きょうのまめちしき */}
                        <TodayTip />
                    </div>
                </div>
            );
        };

        const TodayTip = () => {
            const { setTab } = useUI();
            const idx = useMemo(() => { const d = new Date(); return (d.getFullYear() * 366 + d.getMonth() * 31 + d.getDate()) % EDU_ARTICLES.length; }, []);
            const a = EDU_ARTICLES[idx];
            return (
                <button onClick={() => setTab('learn')} className="btn-press w-full card p-4 text-left anim-fade-up" style={{ background: 'linear-gradient(135deg,#182642,#22335A)', border: 'none' }}>
                    <div className="flex items-center gap-2 text-star text-[10px] font-black tracking-widest mb-1.5"><span>☾</span>きょうのまめちしき</div>
                    <div className="flex items-center gap-3">
                        <span className="text-2xl">{a.icon}</span>
                        <div className="flex-1">
                            <div className="text-cream text-[13px] font-black leading-snug">{a.title}</div>
                            <div className="text-cream/60 text-[10.5px] font-bold mt-0.5">{a.lead}</div>
                        </div>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFE9A8" strokeWidth="3" strokeLinecap="round" className="flex-shrink-0"><polyline points="9 18 15 12 9 6"/></svg>
                    </div>
                </button>
            );
        };

        // ============================================================
        // 睡眠タブ
        // ============================================================
        const moonRating = (n, set) => (
            <div className="flex gap-1.5">
                {[1,2,3,4,5].map(i => (
                    <button key={i} onClick={() => { hapticTap(); set(i); }} className="btn-press text-[26px] leading-none" style={{ filter: i <= n ? 'none' : 'grayscale(1) opacity(.35)' }}>🌙</button>
                ))}
            </div>
        );

        const SleepView = () => {
            const { state, update, addXp } = useApp();
            const { openSheet } = useUI();
            const t = todayYMD();
            const existing = state.sleepLogs[t];
            const [editing, setEditing] = useState(!existing);
            const [form, setForm] = useState(() => existing || { bed:'23:30', wake:'07:00', latency:10, wakes:0, quality:3, morning:3, habits:{ caffeine:false, phone:false, bath:false, alcohol:false, exercise:false }, memo:'' });
            useEffect(() => { if (existing && !editing) setForm(existing); }, [existing, editing]);

            const save = () => {
                const log = { ...form, score: calcSleepScore(form) };
                const isNew = !state.sleepLogs[t];
                update(s => { s.sleepLogs[t] = log; return s; });
                if (isNew) {
                    addXp('sleepLog');
                    if (log.score >= 80) setTimeout(() => addXp('goodSleep'), 700);
                } else {
                    showToast('記録を更新しました', 'success');
                }
                setEditing(false);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // 直近7日
            const week = Array.from({ length: 7 }, (_, i) => { const ymd = ymdAddDays(t, i - 6); const log = state.sleepLogs[ymd]; return { ymd, score: log ? log.score : null }; });
            const recent14 = Array.from({ length: 14 }, (_, i) => state.sleepLogs[ymdAddDays(t, i - 13)]).filter(Boolean);
            const avgScore = recent14.length ? Math.round(recent14.reduce((a, l) => a + l.score, 0) / recent14.length) : null;
            const avgDur = recent14.length ? (recent14.reduce((a, l) => a + (calcDurationH(l.bed, l.wake) || 0), 0) / recent14.length) : null;
            const streak = calcStreak(state);
            const dur = calcDurationH(form.bed, form.wake);

            const habitDefs = [
                { key:'caffeine', icon:'☕', label:'14時以降にカフェイン', bad:true, tip:'カフェインの半減期は4〜6時間。夕方の1杯は夜まで残ります', edu:'edu4' },
                { key:'phone', icon:'📱', label:'寝る直前までスマホ', bad:true, tip:'光と情報刺激のダブルパンチで眠りのブレーキが利きにくく', edu:'edu5' },
                { key:'alcohol', icon:'🍺', label:'お酒を飲んだ', bad:true, tip:'寝酒は後半の眠りを浅くして中途覚醒を増やします', edu:'edu9' },
                { key:'bath', icon:'🛁', label:'湯船につかった', bad:false, tip:'ナイス!就寝90分前の入浴は深部体温の魔法です', edu:'edu6' },
                { key:'exercise', icon:'🏃', label:'体を動かした', bad:false, tip:'日中の運動は眠気の材料づくり。すばらしい!', edu:'edu3' },
            ];

            return (
                <div className="pb-28">
                    <div className="relative overflow-hidden" style={{ background: 'linear-gradient(175deg,#0C1526,#182642)' }}>
                        <StarrySky density={18} shooting={false} />
                        <div className="relative max-w-lg mx-auto px-5 pt-6 pb-5 flex items-center justify-between">
                            <div>
                                <div className="text-cream font-black text-lg">睡眠ノート</div>
                                <div className="text-cream/55 text-[11px] font-bold mt-0.5">🔥 連続 {streak}日 / 14日平均 {avgScore ?? '–'}点・{avgDur ? avgDur.toFixed(1) : '–'}時間</div>
                            </div>
                            <SupiChan size={64} mood={supiMoodOf(state)} stageIdx={SUPI_STAGES.indexOf(supiStage(levelFromXp(state.xp)))} showZzz={false} />
                        </div>
                        <svg viewBox="0 0 400 18" className="block w-full" preserveAspectRatio="none" style={{ height: 18 }}><path d="M0,18 L0,8 Q100,-6 200,8 T400,8 L400,18 Z" fill="#F4F1EA" /></svg>
                    </div>

                    <div className="max-w-lg mx-auto px-4 mt-3 space-y-4">
                        {/* 記録済みサマリー or 入力フォーム */}
                        {existing && !editing ? (
                            <div className="card p-5 anim-fade-up">
                                <div className="flex items-center justify-between mb-2">
                                    <div className="font-black text-[14px]">昨夜の睡眠レポート</div>
                                    <button onClick={() => setEditing(true)} className="text-[11px] font-black text-lav-deep">編集する</button>
                                </div>
                                <div className="flex items-center gap-4">
                                    <ScoreRing score={existing.score} size={104} sub={scoreWord(existing.score)} />
                                    <div className="flex-1 space-y-1.5 text-[12px] font-bold text-[#6B655B]">
                                        <div className="flex justify-between"><span>🛏️ {existing.bed} → {existing.wake}</span><span className="text-night font-black">{calcDurationH(existing.bed, existing.wake)}時間</span></div>
                                        <div className="flex justify-between"><span>💤 寝つき</span><span>{existing.latency <= 15 ? 'すぐ眠れた' : `約${existing.latency}分`}</span></div>
                                        <div className="flex justify-between"><span>🌙 ぐっすり度</span><span>{'🌙'.repeat(existing.quality)}</span></div>
                                        <div className="flex justify-between"><span>🌃 目覚めた回数</span><span>{existing.wakes}回</span></div>
                                    </div>
                                </div>
                                <div className="mt-3 p-3 rounded-2xl bg-[#FAF7F0] flex gap-2.5 items-start">
                                    <div className="flex-shrink-0 mt-0.5"><SupiChan size={40} mood={existing.score >= 78 ? 'happy' : existing.score >= 52 ? 'sleep' : 'tired'} stageIdx={0} showZzz={false} animate={false} /></div>
                                    <div className="text-[11.5px] font-bold text-[#6B655B] leading-relaxed">{
                                        existing.score >= 85 ? '最高の眠りメェ!この調子で「眠れる体」が育っているよ。今夜も同じリズムでいこう✨'
                                        : existing.score >= 70 ? 'いいかんじの眠りメェ。今夜は湯船に入って+4点をねらってみよう🛁'
                                        : existing.score >= 50 ? 'もうひといきメェ。下の生活習慣ヒントの中に、今夜からできることがあるよ'
                                        : 'おつかれのサインだメェ…。今夜は「ケア」タブのぜんしん脱力を、布団の中でいっしょにやろう'
                                    }</div>
                                </div>
                                {/* 習慣フィードバック */}
                                <div className="mt-3 space-y-2">
                                    {habitDefs.filter(h => h.bad ? existing.habits?.[h.key] : !existing.habits?.[h.key] && h.key === 'bath').map(h => (
                                        <div key={h.key} className="flex items-start gap-2.5 p-2.5 rounded-xl" style={{ background: '#FCF3E4' }}>
                                            <span className="text-base">{h.icon}</span>
                                            <div className="text-[11px] font-bold text-[#8B6B3A] leading-relaxed flex-1">{h.bad ? h.tip : '湯船に入らなかった日は寝つきが浅くなりがち。今夜は90分前入浴を試してみて'}</div>
                                        </div>
                                    ))}
                                    {habitDefs.filter(h => !h.bad && existing.habits?.[h.key]).map(h => (
                                        <div key={h.key} className="flex items-start gap-2.5 p-2.5 rounded-xl bg-mint-pale">
                                            <span className="text-base">{h.icon}</span>
                                            <div className="text-[11px] font-bold text-[#3E8B69] leading-relaxed flex-1">{h.tip}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="card p-5 anim-fade-up">
                                <div className="font-black text-[14px] mb-1">{existing ? '記録を編集' : '昨夜の睡眠を記録しよう'}</div>
                                <div className="text-[11px] font-bold text-[#B9B2A6] mb-4">30秒でOK。記録するとスーピーくんが育ちます(+12 XP)</div>

                                    <div className="grid grid-cols-2 gap-3">

                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-black text-[#8B857A] mb-1.5">⏰ 起きた時刻</label>

                                        </div>
                                    </div>
                                    {dur != null && <div className="text-center text-[11px] font-black text-lav-deep -mt-1">睡眠時間 約{dur}時間</div>}
                                    <div>

                    setLeft(prev => {
                        if (prev <= 1) { clearInterval(timerRef.current); setRunning(false); finish(); return 0; }

                hapticYay();

                                    <svg viewBox="0 0 100 100" width="150" height="150">
                                        <circle cx="50" cy="50" r={R} fill="none" stroke="#EFEAE0" strokeWidth="8" />
                                        <circle cx="50" cy="50" r={R} fill="none" stroke="#9D8FD8" strokeWidth="8" strokeLinecap="round"
                                            strokeDasharray={C} strokeDashoffset={C * (1 - pct)}

                                        <text x="50" y="46" textAnchor="middle" style={{ fontSize: 26, fontWeight: 900, fill: '#4A453C', fontFamily: '"Zen Maru Gothic",sans-serif' }}>{running ? left : s.sec}</text>
                                        <text x="50" y="64" textAnchor="middle" style={{ fontSize: 10, fontWeight: 700, fill: '#B9B2A6' }}>秒</text>
                                    </svg>
                                    {running && <div className="absolute -right-3 top-2" style={{ animation: 'float-slow 2s ease-in-out infinite' }}><SupiChan size={56} mood="happy" stageIdx={0} showZzz={false} /></div>}
                                </div>

                            {!finished && (
                                <button onClick={running ? () => { clearInterval(timerRef.current); setRunning(false); setLeft(s.sec); } : start}
                                    className={`btn-press mt-3 px-8 py-3 rounded-full font-black text-[13.5px] ${running ? 'bg-[#EFEAE0] text-[#8B857A]' : 'bg-night text-cream shadow-lg'}`}>
                                    {running ? 'ストップ' : doneToday ? 'もう一度やる(記録ずみ)' : 'タイマーをスタート'}
                                </button>
                            )}
                            {finished && <button onClick={onClose} className="btn-press mt-4 px-8 py-3 rounded-full bg-night text-cream font-black text-[13.5px]">とじる</button>}
